import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
import io
import json

def analyze(options):
    """综合分析主函数 - 支持层次分析法和综合分析法"""
    if not isinstance(options, dict):
        options = options.to_py()
    
    data_path = options.get('data_path')
    method_type = options.get('method_type', 'ahp')  # 'ahp' 或 'comprehensive'
    
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
    
    try:
        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}
    
    if df.empty:
        return {"error": "数据文件为空"}
    
    # 获取数值列
    numeric_cols = df.select_dtypes(include=[np.number]).columns.tolist()
    if len(numeric_cols) < 2:
        return {"error": "数据需要至少2个数值型指标列"}
    
    # 获取用户选择的指标（逗号分隔字符串 → 列表）
    selected_indicators = options.get('indicators', None)
    if selected_indicators and isinstance(selected_indicators, str):
        selected_indicators = [c.strip() for c in selected_indicators.split(',') if c.strip()]
    if selected_indicators and isinstance(selected_indicators, list) and len(selected_indicators) > 0:
        available_cols = [col for col in selected_indicators if col in numeric_cols]
        # 只要用户明确指定了指标，就只使用匹配到的列（至少 1 列即可生效）
        if len(available_cols) >= 1:
            numeric_cols = available_cols
            if len(numeric_cols) < 2:
                return {"error": f"指标匹配后不足 2 个数值列（匹配到: {numeric_cols}）"}
    
    if method_type == 'ahp':
        return run_ahp(df, numeric_cols, options)
    else:
        return run_comprehensive(df, numeric_cols, options)


def run_ahp(df, numeric_cols, options):
    """层次分析法"""
    # 判断矩阵获取优先级：多矩阵(judgement_matrices) > 单矩阵(judgement_matrix) > 自动权重
    weights = None

    # 1. 尝试获取多判断矩阵（来自网格矩阵UI）
    judgement_matrices_str = options.get('judgement_matrices', '')
    if judgement_matrices_str:
        try:
            matrices = json.loads(judgement_matrices_str)
            if isinstance(matrices, list) and len(matrices) > 0:
                # 过滤空矩阵
                valid_matrices = [m for m in matrices if len(m) == len(numeric_cols)]
                if len(valid_matrices) >= 1:
                    agg_matrix = aggregate_matrices(valid_matrices)
                    weights = calculate_ahp_weights(agg_matrix)
        except:
            pass

    # 2. 尝试获取单判断矩阵（向后兼容）
    if weights is None:
        judgement_matrix_str = options.get('judgement_matrix', '')
        if judgement_matrix_str:
            try:
                judgement_matrix = json.loads(judgement_matrix_str)
                if len(judgement_matrix) == len(numeric_cols):
                    weights = calculate_ahp_weights(judgement_matrix)
            except:
                pass
    
    # 3. 自动计算权重（默认）
    if weights is None:
        weights = calculate_auto_weights(df, numeric_cols)
    
    # 标准化并计算得分
    normalized = normalize_minmax(df[numeric_cols].values)
    scores = np.dot(normalized, weights)
    sorted_indices = np.argsort(scores)[::-1]
    
    # 结果表格
    results_table = []
    for i, idx in enumerate(sorted_indices[:20]):
        results_table.append([
            i + 1,
            str(df.iloc[idx, 0]) if df.shape[1] > 0 else f"样本{idx+1}",
            f"{scores[idx]:.4f}"
        ])
    
    table_header = ["排名", "名称/ID", "综合得分"]
    weights_table = [[col, f"{weights[i]:.4f}"] for i, col in enumerate(numeric_cols)]
    
    # 创建可视化
    svgs = []
    bar_svg = create_score_bar_chart(scores[sorted_indices[:10]], results_table[:10])
    if bar_svg:
        svgs.append(bar_svg)
    
    return {
        "svgs": svgs,
        "tables": [
            {"header": table_header, "rows": results_table},
            {"header": ["指标名称", "权重"], "rows": weights_table}
        ],
        "metrics": {
            "样本数": len(df),
            "指标数": len(numeric_cols),
            "方法": "AHP",
            "最高分": f"{scores.max():.4f}",
            "最低分": f"{scores.min():.4f}",
            "平均分": f"{scores.mean():.4f}"
        }
    }


def run_comprehensive(df, numeric_cols, options):
    """综合分析法"""
    method = options.get('method', 'topsis')
    
    # 权重优先级：AHP 判断矩阵 → 标准差法 → 等权重法
    weights = None
    judgement_matrices_str = options.get('judgement_matrices', '')
    if judgement_matrices_str:
        try:
            matrices = json.loads(judgement_matrices_str)
            if isinstance(matrices, list) and len(matrices) > 0:
                valid_matrices = [m for m in matrices if len(m) == len(numeric_cols)]
                if len(valid_matrices) >= 1:
                    agg_matrix = aggregate_matrices(valid_matrices)
                    weights = calculate_ahp_weights(agg_matrix)
        except:
            pass
    
    if weights is None:
        data = df[numeric_cols].values
        stds = data.std(axis=0)
        if stds.sum() > 0:
            weights = stds / (stds.sum() + 1e-10)
        else:
            weights = np.ones(len(numeric_cols)) / len(numeric_cols)
    
    # 标准化
    normalized = normalize_minmax(df[numeric_cols].values)
    
    # 计算得分
    if method == 'topsis':
        scores = topsis(normalized, weights)
    elif method == 'gray_relational':
        scores = gray_relational(normalized, weights)
    else:
        scores = np.dot(normalized, weights)
    
    sorted_indices = np.argsort(scores)[::-1]
    
    # 结果表格
    results_table = []
    for i, idx in enumerate(sorted_indices[:20]):
        results_table.append([
            i + 1,
            str(df.iloc[idx, 0]) if df.shape[1] > 0 else f"样本{idx+1}",
            f"{scores[idx]:.4f}"
        ])
    
    weights_table = [[col, f"{weights[i]:.4f}"] for i, col in enumerate(numeric_cols)]
    
    # 可视化
    svgs = []
    radar_svg = create_radar_chart(normalized[sorted_indices[:8]], numeric_cols, scores[sorted_indices[:8]])
    if radar_svg:
        svgs.append(radar_svg)
    
    dist_svg = create_score_distribution(scores)
    if dist_svg:
        svgs.append(dist_svg)
    
    method_names = {'topsis': 'TOPSIS', 'weighted_sum': '加权和法', 'gray_relational': '灰色关联'}
    
    return {
        "svgs": svgs,
        "tables": [
            {"header": ["排名", "名称/ID", "综合得分"], "rows": results_table},
            {"header": ["指标名称", "权重"], "rows": weights_table}
        ],
        "metrics": {
            "样本数": len(df),
            "指标数": len(numeric_cols),
            "分析方法": method_names.get(method, method),
            "最高分": f"{scores.max():.4f}",
            "最低分": f"{scores.min():.4f}",
            "平均分": f"{scores.mean():.4f}"
        }
    }


def normalize_minmax(data):
    """Min-Max标准化"""
    min_vals = data.min(axis=0)
    max_vals = data.max(axis=0)
    ranges = max_vals - min_vals
    ranges[ranges == 0] = 1
    return (data - min_vals) / ranges


def calculate_auto_weights(df, numeric_cols):
    """自动计算权重（标准差法）"""
    data = df[numeric_cols].values
    data_norm = (data - data.min(axis=0)) / (data.max(axis=0) - data.min(axis=0) + 1e-10)
    stds = data_norm.std(axis=0)
    weights = stds / (stds.sum() + 1e-10)
    return weights


def aggregate_matrices(matrices_list):
    """多判断矩阵逐元素几何平均法聚合

    将多个专家的判断矩阵进行逐元素几何平均，得到聚合判断矩阵。

    Args:
        matrices_list: list of 2D lists/arrays, 每个元素是一个 N×N 判断矩阵

    Returns:
        np.array: 聚合后的判断矩阵
    """
    if not matrices_list or len(matrices_list) == 0:
        return None
    # 转换为 numpy 数组，shape = (k, n, n)
    matrices_arr = np.array([np.array(m) for m in matrices_list])
    # 逐元素相乘
    product = np.prod(matrices_arr, axis=0)
    # 几何平均
    k = len(matrices_list)
    geom_mean = product ** (1.0 / k)
    return geom_mean


def calculate_ahp_weights(matrix):
    """AHP几何平均法计算权重"""
    matrix = np.array(matrix)
    n = len(matrix)
    product = np.prod(matrix, axis=1)
    geometric_mean = product ** (1/n)
    weights = geometric_mean / geometric_mean.sum()
    # 简单一致性检查
    lambda_max = np.sum(np.dot(matrix, weights) / weights) / n
    ci = (lambda_max - n) / (n - 1) if n > 1 else 0
    cr = ci / 0.9 if n == 3 else (ci / 1.12 if n == 4 else ci / 1.24 if n == 5 else ci)
    return weights


def topsis(data, weights):
    """TOPSIS方法"""
    weighted = data * weights
    ideal_best = weighted.max(axis=0)
    ideal_worst = weighted.min(axis=0)
    dist_best = np.sqrt(((weighted - ideal_best) ** 2).sum(axis=1))
    dist_worst = np.sqrt(((weighted - ideal_worst) ** 2).sum(axis=1))
    return dist_worst / (dist_best + dist_worst + 1e-10)


def gray_relational(data, weights):
    """灰色关联分析"""
    reference = data.max(axis=0)
    diff = np.abs(data - reference)
    min_diff = diff.min(axis=0)
    max_diff = diff.max(axis=0)
    rho = 0.5
    rel_coef = (min_diff + rho * max_diff) / (diff + rho * max_diff + 1e-10)
    return np.dot(rel_coef, weights)


def create_score_bar_chart(scores, labels):
    """创建得分条形图"""
    try:
        fig, ax = plt.subplots(figsize=(10, 5))
        ranks = range(1, len(scores) + 1)
        colors = plt.cm.RdYlGn_r(np.linspace(0.2, 0.8, len(scores)))
        bars = ax.bar(ranks, scores, color=colors, edgecolor='white', linewidth=0.5)
        ax.set_xlabel('Rank', fontsize=11)
        ax.set_ylabel('Comprehensive Score', fontsize=11)
        ax.set_title('Top 10 Samples Ranking', fontsize=13, fontweight='bold')
        ax.set_xticks(ranks)
        ax.set_ylim(0, 1.05)
        for bar, score in zip(bars, scores):
            ax.text(bar.get_x() + bar.get_width()/2, bar.get_height() + 0.01,
                   f'{score:.3f}', ha='center', va='bottom', fontsize=9)
        fig.tight_layout()
        buf = io.BytesIO()
        fig.savefig(buf, format='svg')
        plt.close(fig)
        return buf.getvalue().decode()
    except:
        return None


def create_radar_chart(data, labels, scores):
    """创建雷达图"""
    if len(data) == 0:
        return None
    try:
        fig, ax = plt.subplots(figsize=(9, 7), subplot_kw={'projection': 'polar'})
        angles = np.linspace(0, 2 * np.pi, len(labels), endpoint=False).tolist()
        angles += angles[:1]
        colors = plt.cm.Set3(np.linspace(0, 1, min(len(data), 8)))
        for i in range(min(len(data), 8)):
            values = data[i].tolist()
            values += values[:1]
            ax.plot(angles, values, 'o-', linewidth=1.5, color=colors[i],
                   label=f'#{i+1} (Score: {scores[i]:.3f})')
            ax.fill(angles, values, alpha=0.1, color=colors[i])
        ax.set_xticks(angles[:-1])
        ax.set_xticklabels(labels, size=8)
        ax.set_ylim(0, 1)
        ax.legend(loc='upper right', bbox_to_anchor=(1.3, 1.0), fontsize=8)
        ax.set_title('Top 8 Samples - Radar Chart', size=12, pad=20)
        fig.tight_layout()
        buf = io.BytesIO()
        fig.savefig(buf, format='svg', bbox_inches='tight')
        plt.close(fig)
        return buf.getvalue().decode()
    except:
        return None


def create_score_distribution(scores):
    """创建得分分布图"""
    try:
        fig, axes = plt.subplots(1, 2, figsize=(12, 4))
        axes[0].hist(scores, bins=15, edgecolor='black', alpha=0.7, color='steelblue')
        axes[0].set_xlabel('Score')
        axes[0].set_ylabel('Frequency')
        axes[0].set_title('Score Distribution')
        axes[0].axvline(scores.mean(), color='red', linestyle='--', label=f'Mean: {scores.mean():.3f}')
        axes[0].legend()
        sorted_scores = np.sort(scores)[::-1]
        axes[1].plot(range(1, len(sorted_scores) + 1), sorted_scores,
                    'o-', color='steelblue', linewidth=1.5, markersize=3)
        axes[1].set_xlabel('Rank')

    except:

# 扩展线性
import io

import matplotlib.pyplot as plt
import numpy as np
import pandas as pd
from sklearn.linear_model import ElasticNet, Lasso, Ridge
from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score
from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler


def _options_to_dict(options):
    if options is not None and not isinstance(options, dict):
        to_py = getattr(options, "to_py", None)
        if callable(to_py):
            return to_py()
    return options or {}


def _fig_to_svg(fig):
    buf = io.BytesIO()
    fig.tight_layout()
    fig.savefig(buf, format="svg")
    plt.close(fig)
    return buf.getvalue().decode("utf-8")


def _make_model(model_type, alpha, l1_ratio):
    if model_type == "ridge":
        return Ridge(alpha=alpha)
    if model_type == "lasso":
        return Lasso(alpha=alpha, max_iter=10000)
    if model_type == "elasticnet":
        return ElasticNet(alpha=alpha, l1_ratio=l1_ratio, max_iter=10000)
    raise ValueError("模型类型必须是 ridge、lasso 或 elasticnet")


def _coerce_float(value, default):
    if value is None or value == "":
        return default
    try:
        return float(value)
    except Exception:
        return default


def analyze(options):
    options = _options_to_dict(options)

    data_path = options.get("data_path")
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

    model_type = str(options.get("model_type", "ridge")).strip().lower()
    target_col = str(options.get("target_col") or "").strip()
    alpha = max(_coerce_float(options.get("alpha"), 1.0), 0.000001)
    l1_ratio = min(max(_coerce_float(options.get("l1_ratio"), 0.5), 0.0), 1.0)
    test_size = min(max(_coerce_float(options.get("test_size"), 0.25), 0.1), 0.5)

    try:
        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}

    numeric_df = df.select_dtypes(include=[np.number]).dropna(axis=0)
    if numeric_df.shape[1] < 2:
        return {"error": "至少需要 2 个数值列：一个因变量和至少一个自变量"}
    if numeric_df.shape[0] < 5:
        return {"error": "有效样本数太少，至少需要 5 行完整数值数据"}

    if not target_col:
        target_col = numeric_df.columns[-1]
    if target_col not in numeric_df.columns:
        return {"error": f"因变量列不存在或不是数值列: {target_col}"}

    y = numeric_df[target_col].to_numpy(dtype=float)
    x_df = numeric_df.drop(columns=[target_col])
    feature_names = x_df.columns.tolist()
    x = x_df.to_numpy(dtype=float)

    if len(feature_names) < 1:
        return {"error": "至少需要 1 个数值自变量"}

    try:
        x_train, x_test, y_train, y_test = train_test_split(
            x, y, test_size=test_size, random_state=42
        )
    except Exception as e:
        return {"error": f"划分训练集和测试集失败: {e}"}

    scaler = StandardScaler()
    x_train_scaled = scaler.fit_transform(x_train)
    x_test_scaled = scaler.transform(x_test)

    try:
        model = _make_model(model_type, alpha, l1_ratio)
        model.fit(x_train_scaled, y_train)
    except Exception as e:
        return {"error": f"模型训练失败: {e}"}

    y_pred = model.predict(x_test_scaled)
    residuals = y_test - y_pred

    r2 = r2_score(y_test, y_pred)
    rmse = float(np.sqrt(mean_squared_error(y_test, y_pred)))
    mae = float(mean_absolute_error(y_test, y_pred))

    svgs = []

    fig1, ax1 = plt.subplots(figsize=(7, 5))
    ax1.scatter(y_test, y_pred, color="steelblue", edgecolors="#1e3b5c", alpha=0.75)
    min_val = min(float(np.min(y_test)), float(np.min(y_pred)))
    max_val = max(float(np.max(y_test)), float(np.max(y_pred)))
    ax1.plot([min_val, max_val], [min_val, max_val], "--", color="crimson", linewidth=1.5)
    ax1.set_title("真实值 vs 预测值")
    ax1.set_xlabel("真实值")
    ax1.set_ylabel("预测值")
    ax1.grid(alpha=0.25, linestyle="--")
    svgs.append(_fig_to_svg(fig1))

    fig2, ax2 = plt.subplots(figsize=(7, 5))
    ax2.scatter(y_pred, residuals, color="darkorange", edgecolors="#7a4b00", alpha=0.75)
    ax2.axhline(0, linestyle="--", color="crimson", linewidth=1.5)
    ax2.set_title("残差诊断图")
    ax2.set_xlabel("预测值")
    ax2.set_ylabel("残差")
    ax2.grid(alpha=0.25, linestyle="--")
    svgs.append(_fig_to_svg(fig2))

    coef_rows = [
        [name, f"{coef:.6f}"]
        for name, coef in zip(feature_names, model.coef_)
    ]
    coef_rows.sort(key=lambda row: abs(float(row[1])), reverse=True)

    metric_rows = [
        ["模型", model_type],
        ["因变量", target_col],
        ["训练样本数", str(len(y_train))],
        ["测试样本数", str(len(y_test))],
        ["R²", f"{r2:.4f}"],
        ["RMSE", f"{rmse:.4f}"],
        ["MAE", f"{mae:.4f}"],
        ["alpha", f"{alpha:.4f}"],
        ["l1_ratio", f"{l1_ratio:.4f}" if model_type == "elasticnet" else "N/A"],
    ]

    print(f"模型: {model_type}")
    print(f"因变量: {target_col}")
    print(f"自变量数量: {len(feature_names)}")
    print(f"有效样本数: {len(numeric_df)}")

    return {
        "svgs": svgs,
        "metrics": {
            "样本数": len(numeric_df),
            "变量数": len(feature_names),
            "R²": f"{r2:.4f}",
            "RMSE": f"{rmse:.4f}",
        },
        "tables": [
            {"header": ["变量", "标准化系数"], "rows": coef_rows},
            {"header": ["指标", "值"], "rows": metric_rows},
        ],
    }

import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
from sklearn.preprocessing import StandardScaler
from sklearn.decomposition import FactorAnalysis
import io


def analyze(options):
    if not isinstance(options, dict):
        options = options.to_py()

    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

    try:
        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}

    first_col = df.columns[0]
    is_object_first_col = df[first_col].dtype == 'object'
    if is_object_first_col:
        df_numeric = df.drop(columns=[first_col])
    else:
        df_numeric = df.copy()

    df_numeric = df_numeric.select_dtypes(include=[np.number])
    valid_idx = df_numeric.dropna().index
    df_numeric = df_numeric.loc[valid_idx]

    if df_numeric.shape[1] < 3:
        return {"error": f"数值变量仅 {df_numeric.shape[1]} 个，至少需要 3 个"}

    n_samples, n_features = df_numeric.shape
    feature_names = df_numeric.columns.tolist()

    if is_object_first_col:
        sample_labels = df.loc[valid_idx, first_col].tolist()
    else:
        sample_labels = [f"S{i+1}" for i in range(len(valid_idx))]

    scaler = StandardScaler()
    X_scaled = scaler.fit_transform(df_numeric.values)

    corr = np.corrcoef(X_scaled, rowvar=False)
    eig_vals = np.linalg.eigvalsh(corr)[::-1]

    n_factors = int(np.sum(eig_vals > 1))
    max_factors = min(n_features, n_samples - 1)
    if n_factors < 1:
        n_factors = min(2, max_factors)
    elif n_factors > max_factors:
        n_factors = max_factors

    svgs = []

    fig1, ax1 = plt.subplots(figsize=(8, 4))
    ax1.plot(range(1, n_features + 1), eig_vals, 'bo-', markersize=6, linewidth=2)
    ax1.axhline(y=1, color='r', linestyle='--', alpha=0.7, label='特征值=1')
    ax1.set_xlabel('因子序号', fontsize=11)
    ax1.set_ylabel('特征值', fontsize=11)
    ax1.set_title('碎石图 (Scree Plot)', fontsize=13, fontweight='bold')
    ax1.legend(fontsize=9)
    ax1.grid(alpha=0.3, linestyle='--')
    ax1.set_xticks(range(1, n_features + 1))
    fig1.tight_layout()
    buf = io.BytesIO()
    fig1.savefig(buf, format='svg')
    plt.close(fig1)
    svgs.append(buf.getvalue().decode())

    fa = FactorAnalysis(n_components=n_factors, random_state=42, rotation='varimax')
    fa.fit(X_scaled)
    loadings = fa.components_.T
    scores = fa.transform(X_scaled)

    communality = np.sum(loadings**2, axis=1)

    variance = np.sum(loadings**2, axis=0)
    total_var = n_features
    if total_var > 0:
        proportion_var = variance / total_var
    else:
        proportion_var = np.ones(n_factors) / n_factors
    cumulative_var = np.cumsum(proportion_var)

    factor_names = [f'Factor {i+1}' for i in range(n_factors)]

    fig2, ax2 = plt.subplots(figsize=(8, max(4, n_features * 0.35)))
    im = ax2.imshow(loadings, aspect='auto', cmap='coolwarm', vmin=-1, vmax=1)
    ax2.set_xticks(range(n_factors))
    ax2.set_xticklabels(factor_names, fontsize=10)
    ax2.set_yticks(range(n_features))
    ax2.set_yticklabels(feature_names, fontsize=10)
    ax2.set_title('旋转后因子载荷热图', fontsize=13, fontweight='bold')
    for i in range(n_features):
        for j in range(n_factors):
            val = loadings[i, j]
            c = 'white' if abs(val) > 0.5 else 'black'
            ax2.text(j, i, f'{val:.2f}', ha='center', va='center', fontsize=8, color=c)
    fig2.colorbar(im, ax=ax2, shrink=0.8)
    fig2.tight_layout()
    buf = io.BytesIO()
    fig2.savefig(buf, format='svg')
    plt.close(fig2)
    svgs.append(buf.getvalue().decode())

    if n_factors >= 2:
        fig3, ax3 = plt.subplots(figsize=(8, 6))
        ax3.scatter(scores[:, 0], scores[:, 1], c='steelblue', s=60, alpha=0.7, edgecolors='#1e3b5c')
        for i, lbl in enumerate(sample_labels):
            ax3.annotate(lbl, (scores[i, 0], scores[i, 1]),
                        textcoords="offset points", xytext=(5, 5), fontsize=7, alpha=0.8)
        ax3.axhline(y=0, color='grey', linestyle='--', alpha=0.5)
        ax3.axvline(x=0, color='grey', linestyle='--', alpha=0.5)
        ax3.set_xlabel('Factor 1', fontsize=11)
        ax3.set_ylabel('Factor 2', fontsize=11)
        ax3.set_title('前两个因子得分图（旋转后）', fontsize=13, fontweight='bold')
        ax3.grid(alpha=0.3, linestyle='--')
        fig3.tight_layout()
        buf = io.BytesIO()
        fig3.savefig(buf, format='svg')
        plt.close(fig3)
        svgs.append(buf.getvalue().decode())

    loadings_header = ['变量'] + factor_names + ['共同度']
    loadings_rows = []
    for i, vn in enumerate(feature_names):
        row = [vn] + [f'{loadings[i, j]:.4f}' for j in range(n_factors)] + [f'{communality[i]:.4f}']
        loadings_rows.append(row)

    var_header = ['因子', '方差', '贡献率', '累积贡献率']
    var_rows = []
    for j in range(n_factors):
        var_rows.append([
            f'Factor {j+1}',
            f'{variance[j]:.4f}',
            f'{proportion_var[j]:.1%}',
            f'{cumulative_var[j]:.1%}'
        ])

    scores_header = ['样本'] + [f'F{j+1}' for j in range(n_factors)]
    scores_rows = []
    for i in range(min(10, n_samples)):
        row = [sample_labels[i]] + [f'{scores[i, j]:.4f}' for j in range(n_factors)]
        scores_rows.append(row)

    return {
        "svgs": svgs,
        "metrics": {
            "提取因子数": n_factors,
            "变量数": n_features,
            "样本数": n_samples,
            "累积贡献率": f"{cumulative_var[-1]:.1%}"
        },
        "tables": [
            {"header": loadings_header, "rows": loadings_rows},
            {"header": var_header, "rows": var_rows},
            {"header": scores_header, "rows": scores_rows},
        ],
    }

import numpy as np
import matplotlib.pyplot as plt
import matplotlib.font_manager as fm
from sklearn.decomposition import PCA as SKPCA
import io


def pca(options):

    if not isinstance(options, dict):
        options = options.to_py()
    n_components = options.get('n_components') or None
    data_path = options.get('data_path')

    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}

    first_col = df.columns[0]
    if df[first_col].dtype == 'object':
        sample_labels = df[first_col].tolist()
        df_numeric = df.drop(columns=[first_col])
    else:
        sample_labels = [f"sample{i+1}" for i in range(len(df))]
        df_numeric = df.copy()

    df_numeric = df_numeric.select_dtypes(include=[np.number])
    constant_cols = df_numeric.columns[df_numeric.std() < 1e-10].tolist()
    if constant_cols:
        df_numeric = df_numeric.drop(columns=constant_cols)

    feature_names = df_numeric.columns.tolist()
    n_samples, n_features = df_numeric.shape

        return {"error": f"数值变量仅 {n_features} 个，至少需要 2 个"}

    from sklearn.preprocessing import StandardScaler
    X_scaled = StandardScaler().fit_transform(df_numeric.values)

    

    max_pc = min(n_samples, n_features)
    if n_components is None:
        n_components = min(max_pc, 6)
    else:
        n_components = int(min(n_components, max_pc))

    pca_full = SKPCA()

    pca_model = SKPCA(n_components=n_components)
    scores = pca_model.fit_transform(X_scaled)
    loadings = pca_model.components_.T
    explained_var = pca_model.explained_variance_ratio_
    cum_var = np.cumsum(explained_var)

    pc_names = [f'PC{i+1}' for i in range(n_components)]

    svgs = []

    # 图1: 方差解释比例柱状图

    for b, v in zip(bars, explained_var):
        ax1.text(b.get_x() + b.get_width() / 2, b.get_height() + 0.01,
                 f'{v:.1%}', ha='center', va='bottom', fontsize=10, fontweight='bold')

    # 图2: 累积方差折线图
    fig2, ax2 = plt.subplots(figsize=(8, 4))
    cum_var_full = np.cumsum(pca_full.explained_variance_ratio_)
    pc_range = range(1, len(cum_var_full) + 1)
    ax2.plot(pc_range, cum_var_full, 'o--', color='lightgray', markersize=5,
             linewidth=1.5, label='All PCs')
    ax2.plot(range(1, n_components + 1), cum_var, 'o-', color='darkorange',
             markersize=8, linewidth=2.5, label='Selected PCs', zorder=5)
    for th, clr, lbl in [(0.8, 'green', '80%'), (0.9, 'red', '90%'), (0.95, 'purple', '95%')]:
        ax2.axhline(y=th, color=clr, linestyle='--', alpha=0.6, linewidth=1)
        ax2.text(max_pc + 0.3, th, lbl, color=clr, fontsize=9, va='center')
    ax2.set_xlabel('Number of PCs', fontsize=11)
    ax2.set_ylabel('Cumulative explained variance ratio', fontsize=11)
    ax2.set_title('Cumulative explained variance ratio', fontsize=13, fontweight='bold')
    ax2.set_xticks(range(1, max_pc + 1))
    ax2.set_xlim(0.5, max_pc + 1.2)
    ax2.set_ylim(0, 1.05)
    ax2.legend(loc='lower right', fontsize=9)
    ax2.grid(alpha=0.3, linestyle='--')
    fig2.tight_layout()
    buf = io.BytesIO()
    fig2.savefig(buf, format='svg')
    plt.close(fig2)
    svgs.append(buf.getvalue().decode())

    # 图3: 得分散点图
    fig3, ax3 = plt.subplots(figsize=(7, 6))
    if n_components >= 2:
        ax3.scatter(scores[:, 0], scores[:, 1], c='steelblue', edgecolors='#1e3b5c',
                    s=70, alpha=0.75, zorder=3)
        # for i, lbl in enumerate(sample_labels):
        #     ax3.annotate(lbl, (scores[i, 0], scores[i, 1]),
        #                  textcoords="offset points", xytext=(5, 5),
        #                  fontsize=7, alpha=0.85)
        ax3.set_xlabel(f'PC1 ({explained_var[0]:.1%})', fontsize=11)
        ax3.set_ylabel(f'PC2 ({explained_var[1]:.1%})', fontsize=11)
        ax3.set_title('PCA score ', fontsize=13, fontweight='bold')
    else:
        ax3.text(0.5, 0.5, 'Only one PC', transform=ax3.transAxes,
                 ha='center', va='center', fontsize=14, color='gray')
    ax3.axhline(y=0, color='grey', linestyle='--', alpha=0.5, zorder=1)
    ax3.axvline(x=0, color='grey', linestyle='--', alpha=0.5, zorder=1)
    ax3.grid(alpha=0.3, linestyle='--', zorder=0)
    fig3.tight_layout()
    buf = io.BytesIO()
    fig3.savefig(buf, format='svg')
    plt.close(fig3)
    svgs.append(buf.getvalue().decode())

    # 图4: 双标图
    fig4, ax4 = plt.subplots(figsize=(8, 7))
    if n_components >= 2:
        ax4.scatter(scores[:, 0], scores[:, 1], c='steelblue', edgecolors='#1e3b5c',
                    s=50, alpha=0.6, label='samples', zorder=3)
        scale = (np.max(np.abs(scores[:, :2])) * 0.9 /
                 max(np.max(np.abs(loadings[:, :2])), 1e-10))
        for i, vn in enumerate(feature_names):
            ax4.arrow(0, 0, loadings[i, 0] * scale, loadings[i, 1] * scale,
                      head_width=scale * 0.08, head_length=scale * 0.12,
                      fc='crimson', ec='darkred', alpha=0.85, linewidth=1.5, zorder=4)
            ax4.text(loadings[i, 0] * scale * 1.15, loadings[i, 1] * scale * 1.15,
                     vn, color='darkred', fontsize=9, fontweight='bold',
                     ha='center', va='center')
        ax4.set_xlabel(f'PC1 ({explained_var[0]:.1%})', fontsize=11)
        ax4.set_ylabel(f'PC2 ({explained_var[1]:.1%})', fontsize=11)
        ax4.set_title('PCA biplot', fontsize=13, fontweight='bold')
        ax4.legend(loc='upper right', fontsize=9)
    else:
        ax4.text(0.5, 0.5, 'Unable to draw biplot', transform=ax4.transAxes,
                 ha='center', va='center', fontsize=14, color='gray')
    ax4.axhline(y=0, color='grey', linestyle='--', alpha=0.4, zorder=1)
    ax4.axvline(x=0, color='grey', linestyle='--', alpha=0.4, zorder=1)
    ax4.grid(alpha=0.3, linestyle='--', zorder=0)
    fig4.tight_layout()
    buf = io.BytesIO()
    fig4.savefig(buf, format='svg')
    plt.close(fig4)
    svgs.append(buf.getvalue().decode())

    # 载荷矩阵
    table = []
    for i, vn in enumerate(feature_names):
        row = [vn] + [f'{loadings[i, j]:.4f}' for j in range(n_components)]
        table.append(row)
    table_header = ['variable'] + pc_names

    # 得分矩阵
    scores_table = []
    for i, lbl in enumerate(sample_labels):
        row = [lbl] + [f'{scores[i, j]:.4f}' for j in range(n_components)]
        scores_table.append(row)
    scores_header = ['sample'] + pc_names

    return {
        "svgs": svgs,
        "metrics": {
            "samples num": n_samples,
            "variable num": n_features,
            "PC num": n_components,
            "Cumulative variance": f"{cum_var[-1]:.1%}"
        },
        "tables": [
            {"header": table_header, "rows": table},
            {"header": scores_header, "rows": scores_table},
        ],
    }

  </script>

  <script type="text/python-src" data-module="Visualization">
import pandas as pd
import matplotlib.pyplot as plt
import io

def generate_visualization(options):
    if not isinstance(options, dict):
        to_py = getattr(options, "to_py", None)
        if callable(to_py):
            options = to_py()
        else:
            options = dict(options)
            
    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
    
    chart_type = options.get('chart_type', '单变量条图')
    x_var = options.get('x_var')
    y_var = options.get('y_var')
    
    try:
        if str(data_path).endswith('.csv'):
            df = pd.read_csv(data_path)
        else:
            df = pd.read_excel(data_path)
            
        if df.select_dtypes(include=['object']).shape[1] > 0:
            first_obj_col = df.select_dtypes(include=['object']).columns[0]
            df.set_index(first_obj_col, inplace=True)
            
        data_volume = len(df)
        dimensions = df.shape[1]
        missing_values = int(df.isna().sum().sum())
        
        numeric_df = df.select_dtypes(include='number')
        
        mean_series = numeric_df.mean()
        mean_table = [["变量", "均值"]] + [[str(k), f"{v:.4f}"] for k, v in mean_series.items()]
        
        cov_df = numeric_df.cov()
        cov_table = [["变量"] + list(cov_df.columns)]
        for idx, row in cov_df.iterrows():
            cov_table.append([str(idx)] + [f"{x:.4f}" for x in row])
            
        corr_df = numeric_df.corr()
        corr_table = [["变量"] + list(corr_df.columns)]
        for idx, row in corr_df.iterrows():
            corr_table.append([str(idx)] + [f"{x:.4f}" for x in row])

        plt.rcParams['font.sans-serif'] = ['SimHei']
        plt.rcParams['axes.unicode_minus'] = False
        
        target_idx = x_var
        if target_idx not in df.index:
            try:
                target_idx = int(target_idx)
            except (ValueError, TypeError):
                pass
        
        if chart_type == '多变量矩阵散点图':
            axes = pd.plotting.scatter_matrix(numeric_df, figsize=(10, 10))
            fig = axes[0, 0].get_figure()
        else:
            fig, ax = plt.subplots(figsize=(10, 5))
            if chart_type == '单变量条图' and y_var in df.columns:
                df[y_var].plot(kind='bar', ax=ax)
            elif chart_type == '多变量条图':
                numeric_df.plot(kind='bar', ax=ax)
            elif chart_type == '基于单样品的条图' and target_idx in df.index:
                df.loc[target_idx].plot(kind='bar', ax=ax)
            elif chart_type == '统计量的箱线图':
                numeric_df.plot(kind='box', ax=ax)
            elif chart_type == '两变量散点图' and x_var in df.columns and y_var in df.columns:
                df.plot(kind='scatter', x=x_var, y=y_var, ax=ax)
            elif chart_type == '单变量饼图' and y_var in df.columns:
                df[y_var].plot(kind='pie', ax=ax, autopct='%1.1f%%')
                ax.set_ylabel('')
            elif chart_type == '多变量饼图' and y_var:
                cols = [c.strip() for c in str(y_var).split(',') if c.strip() in numeric_df.columns]
                if cols:
                    numeric_df[cols].sum().plot(kind='pie', ax=ax, autopct='%1.1f%%')
                    ax.set_ylabel('')
                else:
                    ax.text(0.5, 0.5, '参数不足或变量不存在', ha='center', va='center', fontsize=12)
            else:
                ax.text(0.5, 0.5, '参数不足或变量不存在', ha='center', va='center', fontsize=12)
            fig.tight_layout()
            
        buf = io.BytesIO()
        fig.savefig(buf, format='svg')
        plt.close(fig)
        svg_str = buf.getvalue().decode('utf-8')
        
        return {
            "svgs": [svg_str],
            "metrics": {
                "数据量": data_volume,
                "维度": dimensions,
                "缺失值": missing_values
            },
            "tables": [
                {
                    "title": "变量均值",
                    "header": mean_table[0],
                    "rows": mean_table[1:]
                },
                {
                    "title": "协方差矩阵",
                    "header": cov_table[0],
                    "rows": cov_table[1:]
                },
                {
                    "title": "相关系数矩阵",
                    "header": corr_table[0],
                    "rows": corr_table[1:]
                }
            ]
        }
        
    except Exception as e:
        return {"error": str(e)}
  </script>
