<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatCore - 多元统计分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sheet-selector {
      background: #f8fafd;
      border: 1px solid #eef1f5;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 28px;
    }
    .sheet-selector-title {
      font-size: 13px;
      font-weight: 500;
      color: #3a4a5a;
      margin-bottom: 10px;
    }
    .sheet-selector-title i {
      color: #2a5c8a;
      margin-right: 6px;
    }
    .sheet-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sheet-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #3e5060;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sheet-option:hover {
      background: #e7f0fa;
    }
    .sheet-option input[type="radio"] {
      accent-color: #2a5c8a;
    }
    .btn-confirm-sheet {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #2a5c8a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-confirm-sheet:hover {
      background: #1e4b6e;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-chart-scatter"></i></div>
        <div>
          <div class="logo-text">StatCore</div>
          <div class="logo-sub">多元统计分析·课程作业</div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-content">
          <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
          <div class="drop-text">
            <span class="drop-primary">拖拽文件到此处</span>
            <span class="drop-secondary">或</span>
            <label class="browse-btn">
              浏览文件<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
            </label>
          </div>
          <div class="drop-hint">支持 CSV、Excel 文件</div>
        </div>
      </div>

      <div id="sheetSelector" class="sheet-selector" style="display:none;">
        <div class="sheet-selector-title"><i class="fas fa-file-excel"></i> 选择要导入的工作表</div>
        <div id="sheetOptions" class="sheet-options"></div>
        <button id="confirmSheet" class="btn-confirm-sheet">确认导入</button>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-module="clustering"><i class="fas fa-layer-group"></i> 聚类分析</button>
        <button class="nav-item" data-module="visualization"><i class="fas fa-flask"></i> 可视化</button>
        <button class="nav-item" data-module="statistics"><i class="fas fa-chart-bar"></i> 统计评价</button>
        <button class="nav-item" data-module="pca"><i class="fas fa-arrow-down-wide-short"></i> 主成分分析</button>
        <button class="nav-item" data-module="factor"><i class="fas fa-cube"></i> 因子分析</button>
        <button class="nav-item" data-module="correspondence"><i class="fas fa-arrows-left-right"></i> 对应分析</button>
        <button class="nav-item" data-module="regression"><i class="fas fa-chart-line"></i> 相关与回归</button>
        <button class="nav-item" data-module="canonical"><i class="fas fa-link"></i> 典型相关</button>
        <button class="nav-item" data-module="extended"><i class="fas fa-plus-minus"></i> 扩展线性</button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-module="python"><i class="fas fa-code"></i> Python 代码</button>
        <button class="nav-item"><i class="fas fa-history"></i> 历史记录</button>
        <button class="nav-item" data-module="test"><i class="fas fa-plus-minus"></i> 测试</button>
      </nav>

      <div class="sidebar-footer">
        <i class="far fa-lightbulb"></i> 浏览器端 Python · Pyodide<br>
        <span style="opacity:0.7;">所有计算在本地 WebAssembly 中完成</span>
        <div class="py-status" style="margin-top:8px; font-size:12px; color:#8a9aaa;">
          <i class="fas fa-spinner fa-pulse"></i> 加载 Pyodide 中...
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
          <div class="progress-text"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="module-loading" style="text-align:center; padding:80px 20px; color:#8a9aaa;">
        <i class="fas fa-spinner fa-pulse fa-2x"></i>
        <p style="margin-top:16px;">加载模块中...</p>
      </div>
      <script>
window.MODULE_HTML = {
  "canonical": `<div class="module-content" id="canonical">
  <div class="page-header">
    <div class="header-left"><h1>典型相关</h1><div class="breadcrumb"><i class="fas fa-folder-open"></i> 关系 / 典型</div></div>
  </div>
  <div class="module-placeholder">
    <div class="placeholder-icon"><i class="fas fa-link"></i></div>
    <h2>典型相关模块</h2>
    <p>该模块正在开发中，将通过 Pyodide 执行 Python 实现。</p>
    <ul><li>典型变量提取</li><li>典型相关系数</li><li>结构分析</li></ul>
  </div>
</div>
`,
  "clustering": `<div class="module-content active" id="clustering">
  <div class="page-header">
    <div class="header-left">
      <h1>聚类分析 · K-Means</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 当前任务 / 无监督学习 / 聚类</div>
    </div>
    <div class="header-actions">
      <button class="btn-outline btn-export" type="button"><i class="fas fa-download"></i> 导出报告</button>
      <button class="btn-primary btn-run" data-module="Clustering" data-func="analyze">
        <i class="fas fa-play"></i> 运行分析
      </button>
    </div>
  </div>

  <div class="param-card">
    <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 聚类参数配置</div>
    <div class="param-grid">
      <div class="param-field">
        <label>算法</label>
        <select class="fake-select-control" data-param="algorithm">
          <option value="kmeans" selected>K-Means</option>
          <option value="hierarchical">Hierarchical</option>
        </select>
      </div>
      <div class="param-field">
        <label>Loss</label>
        <select class="fake-select-control" data-param="loss">
          <option value="lloyd" selected>lloyd</option>
          <option value="elkan">elkan</option>
        </select>
      </div>
      <div class="param-field">
        <label>簇数量 K</label>
        <input class="fake-select-control" data-param="n_clusters" type="number" min="2" max="12" value="3">
      </div>
      <div class="param-field">
        <label>初始化方法</label>
        <select class="fake-select-control" data-param="init">
          <option value="k-means++" selected>k-means++</option>
          <option value="random">random</option>
        </select>
      </div>
      <div class="param-field">
        <label>最大迭代</label>
        <input class="fake-select-control" data-param="max_iter" type="number" min="50" max="2000" value="300">
      </div>
      <div class="param-field">
        <label>图形类型</label>
        <select class="fake-select-control" data-param="plot_type">
          <option value="scatter" selected>Scatter</option>
          <option value="dendrogram">Dendrogram</option>
        </select>
      </div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <h3><i class="fas fa-chart-pie" style="margin-right:8px; color:#1e4b6e;"></i>聚类散点图 (前两个主成分)</h3>
    </div>
    <div class="chart-container" style="min-height:240px;display:flex;align-items:center;justify-content:center;color:#7a8c9d;">
      点击“运行分析”后在这里显示图形
    </div>
    <pre class="py-output" style="margin:12px 8px 0;padding:10px 12px;background:#f6f9fc;border:1px solid #e2eaf2;border-radius:8px;color:#3e5468;font-size:12px;white-space:pre-wrap;">等待运行...</pre>
  </div>

  <div class="metrics-row">
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-circle-nodes"></i> 轮廓系数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-arrows-up-down"></i> CH 指数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-merge"></i> DB 指数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-table-cells"></i> 簇内平方和</div>
      <div class="metric-value">--</div>
    </div>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-clipboard-list"></i> 聚类中心 & 各簇样本数</span>
      <span class="badge">Python 计算</span>
    </div>
    <table class="simple-table">
      <thead><tr><th>簇</th><th>样本数</th><th>中心 1</th><th>中心 2</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-clipboard-list"></i> 各聚类指标</span>
      <span class="badge">评价指标</span>
    </div>
    <table class="simple-table">
      <thead><tr><th>sheet</th><th>轮廓系数</th><th>CH 指数</th><th>DB 指数</th><th>簇内平方和</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
`,
  "correspondence": `<div class="module-content" id="correspondence">
  <div class="page-header">
    <div class="header-left"><h1>对应分析</h1><div class="breadcrumb"><i class="fas fa-folder-open"></i> 降维 / 对应</div></div>
  </div>
  <div class="module-placeholder">
    <div class="placeholder-icon"><i class="fas fa-arrows-left-right"></i></div>
    <h2>对应分析模块</h2>
    <p>该模块正在开发中，将通过 Pyodide 执行 Python 实现。</p>
    <ul><li>列联表分析</li><li>行剖面图</li><li>双标图</li></ul>
  </div>
</div>
`,
  "extended": `<div class="module-content" id="extended">
  <div class="page-header">
    <div class="header-left"><h1>扩展线性</h1><div class="breadcrumb"><i class="fas fa-folder-open"></i> 扩展 / 线性</div></div>
  </div>
  <div class="module-placeholder">
    <div class="placeholder-icon"><i class="fas fa-plus-minus"></i></div>
    <h2>扩展线性模块</h2>
    <p>该模块正在开发中，将通过 Pyodide 执行 Python 实现。</p>
    <ul><li>岭回归</li><li>Lasso回归</li><li>弹性网回归</li></ul>
  </div>
</div>
`,
  "factor": `<div class="module-content" id="factor">
  <div class="page-header">
    <div class="header-left"><h1>因子分析</h1><div class="breadcrumb"><i class="fas fa-folder-open"></i> 降维 / 因子</div></div>
  </div>
  <div class="module-placeholder">
    <div class="placeholder-icon"><i class="fas fa-cube"></i></div>
    <h2>因子分析模块</h2>

`,
  "pca": `<div class="module-content" id="pca">
  <div class="page-header">
    <div class="header-left">
      <h1>主成分分析 · PCA</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 降维 / PCA / 方差解释</div>
    </div>
    <div class="header-actions">
      <button class="btn-primary btn-run" data-module="Pca" data-func="pca" disabled>
        <i class="fas fa-play"></i> 运行分析
      </button>
    </div>
  </div>

  <div class="param-card">
    <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 分析参数</div>
    <div class="param-grid">
      <div class="param-field">
        <label>主成分个数</label>
        <input type="number" data-param="n_components" min="2" max="20" placeholder="自动"
               style="background:#f9fbfd;border:1px solid #d6e0ea;border-radius:40px;padding:10px 18px;font-size:14px;width:140px;text-align:center;">
      </div>

    <p style="color:#738fa0; margin-top:10px; font-size:12px;">留空自动选择（最多 6 个）。请先在左侧上传数据文件。</p>

  <div class="metrics-row">
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-hashtag"></i> 样本数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-list"></i> 变量数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-cubes"></i> 主成分数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-chart-pie"></i> 累积方差</div>
      <div class="metric-value">--</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <h3><i class="fas fa-chart-bar" style="margin-right:8px; color:#1e4b6e;"></i>方差解释 + 降维可视化</h3>
    </div>
    <div class="chart-container" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    </div>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-table"></i> 载荷矩阵</span>
      <span class="badge">变量在各主成分上的权重</span>
    </div>
    <table class="simple-table">
      <thead><tr><th>变量</th><th>PC1</th><th>PC2</th><th>PC3</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-table"></i> 样本得分</span>
      <span class="badge">各样本的主成分得分</span>
    </div>
    <table class="simple-table">
      <thead><tr><th>样本</th><th>PC1</th><th>PC2</th><th>PC3</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
`,
  "regression": `<div class="module-content" id="regression">
  <div class="page-header">
    <div class="header-left"><h1>相关与回归</h1><div class="breadcrumb"><i class="fas fa-folder-open"></i> 关系 / 回归</div></div>
  </div>
  <div class="module-placeholder">
    <div class="placeholder-icon"><i class="fas fa-chart-line"></i></div>
    <h2>相关与回归模块</h2>
    <p>该模块正在开发中，将通过 Pyodide 执行 Python 实现。</p>
    <ul><li>相关分析</li><li>线性回归</li><li>残差诊断</li></ul>
  </div>
</div>
`,
  "statistics": `<div class="module-content" id="statistics">
  <div class="page-header">
    <div class="header-left">
      <h1>统计评价</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 评估 / 统计评价</div>
    </div>
  </div>

  <!-- ==================== 描述性统计 ==================== -->
  <div class="eval-panel active" id="panel-descriptive">
    <div class="param-card">
      <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 描述性统计参数</div>
      <div class="param-grid">
        <div class="param-field">
          <label>选择变量</label>
          <div class="fake-select">
            <input type="text" data-param="column" placeholder="留空=所有数值变量" style="border:none;background:transparent;font-size:14px;width:100%;outline:none;">
          </div>
        </div>
      </div>
      <button class="btn-primary btn-run" data-module="Evaluation" data-func="descriptive" disabled style="margin-top:12px;">
        <i class="fas fa-play"></i> 运行分析
      </button>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-hashtag"></i> 样本量</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-calculator"></i> 均值</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-align-center"></i> 中位数</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-arrows-up-down"></i> 标准差</div>
        <div class="metric-value">--</div>
      </div>
    </div>

    <div class="table-preview">
      <div class="preview-header">
        <span><i class="fas fa-table"></i> 描述性统计结果</span>
        <span class="badge">数值变量分析</span>
      </div>
      <table class="simple-table">
        <thead><tr><th>统计指标</th><th>---</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <pre class="py-output" style="margin-top:16px;">点击运行开始分析...</pre>
  </div>

  <!-- ==================== 正态性检验 ==================== -->
  <div class="eval-panel" id="panel-normality">
    <div class="param-card">
      <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 正态性检验参数</div>
      <div class="param-grid">
        <div class="param-field">
          <label>选择变量</label>
          <div class="fake-select">
            <input type="text" data-param="column" placeholder="留空=所有数值变量" style="border:none;background:transparent;font-size:14px;width:100%;outline:none;">
          </div>
        </div>
        <div class="param-field">
          <label>显著性水平 (α)</label>
          <select data-param="alpha" style="background:#f9fbfd;border:1px solid #d6e0ea;border-radius:40px;padding:10px 20px;font-size:14px;">

        <div class="metric-value">--</div>
      </div>

        <div class="metric-label"><i class="fas fa-info-circle"></i> 显著性水平</div>
        <div class="metric-value">--</div>
      </div>

    <div class="chart-card">
      <div class="chart-header">
        <h3><i class="fas fa-chart-line" style="margin-right:8px; color:#1e4b6e;"></i>Q-Q 图</h3>
      </div>
      <div class="chart-container"></div>
    </div>

    <div class="table-preview" style="margin-top:8px;">
      <div class="preview-header">
        <span><i class="fas fa-table"></i> 检验结果</span>
        <span class="badge">Shapiro-Wilk</span>
      </div>
      <table class="simple-table">
        <thead><tr><th>检验项目</th><th>统计量</th><th>p值</th><th>结论</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <pre class="py-output" style="margin-top:16px;">点击运行开始分析...</pre>
  </div>

  <!-- ==================== 方差分析 ==================== -->
  <div class="eval-panel" id="panel-anova">
    <div class="param-card">
      <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 方差分析参数</div>
      <div class="param-grid">
        <div class="param-field">

<span style="color: #F8F8F2">)</span> <span style="color: #FF4689">-&gt;</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame:</span>
<span style="color: #F8F8F2">    </span><span style="color: #E6DB74">&quot;&quot;&quot;</span>

    <span style="color: #959077"># 标识列处理</span>

        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_data</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index]</span>

            <span style="color: #66D9EF">continue</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">df</span> <span style="color: #FF4689">is</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">:</span>
        <span style="color: #66D9EF">raise</span> <span style="color: #A6E22E">ValueError</span><span style="color: #F8F8F2">(</span><span style="color: #E6DB74">f&quot;无法读取文件: {</span><span style="color: #F8F8F2">input_path</span><span style="color: #E6DB74">}&quot;</span><span style="color: #F8F8F2">)</span>

import os
import re
from typing import Union

import numpy as np
import pandas as pd
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import StandardScaler


# 数据清洗
def _clean_series_numeric(series: pd.Series) -> pd.Series:
    """
    向量化清洗单个 Series 中的数值格式：
    - 货币符号（$€¥£₹等）
    - 百分号（转除以100）
    - 千位分隔符（逗号、空格）
    - 全角数字、全角负号/小数点
    - 括号负数 -> 负号
    """
    # 先尝试直接转为数值
    numeric = pd.to_numeric(series, errors='coerce', downcast='float')
    
    # 未被转换成功的索引
    failed_mask = numeric.isna() & series.notna()
    if not failed_mask.any():
        return numeric
    
    # 对失败的条目进行字符串清理
    failed_vals = series[failed_mask].astype(str).str.strip()
    
    # 1. 全角负号和小数点映射
    fullwidth_map = str.maketrans('－．', '-.')
    failed_vals = failed_vals.str.translate(fullwidth_map)
    
    # 2. 全角数字转半角
    fullwidth_digits = str.maketrans('０１２３４５６７８９', '0123456789')
    failed_vals = failed_vals.str.translate(fullwidth_digits)
    
    # 3. 移除货币符号
    currency_pattern = r'[$€¥£₹]'
    failed_vals = failed_vals.str.replace(currency_pattern, '', regex=True)
    
    # 4. 处理括号负数： (123.45) -> -123.45
    failed_vals = failed_vals.str.replace(r'^\((.*)\)$', r'-\1', regex=True)
    
    # 5. 移除百分号并除以100
    pct_mask = failed_vals.str.contains(r'%', na=False)
    failed_vals = failed_vals.str.replace(r'%', '', regex=True)
    
    # 6. 移除千位分隔符（逗号）和空格（只移除数字内部的空格，保守处理）
    failed_vals = failed_vals.str.replace(',', '', regex=False)
    failed_vals = failed_vals.str.replace(' ', '', regex=False)
    
    # 第二次转数值
    cleaned_numeric = pd.to_numeric(failed_vals, errors='coerce', downcast='float')
    
    # 百分比除以100
    if pct_mask.any():
        # pct_mask 索引对应原始 failed_mask 内的子集，需要对齐
        # 在 cleaned_numeric 上，根据原始的带%标记来调整
        pct_mask_full = failed_mask.copy()
        pct_mask_full[failed_mask] = pct_mask
        numeric.loc[pct_mask_full] = cleaned_numeric.loc[pct_mask] / 100.0
    else:
        numeric.loc[failed_mask] = cleaned_numeric
    
    return numeric


def clean_dataframe(
    df: pd.DataFrame,
    name_col_index: Union[int, str] = 0,
    missing_strategy: str = "mean",
    standardize: bool = True
) -> pd.DataFrame:
    """
    清洗数据框中的数值列，保留一列标识列（如名称）。
 
    参数:
        df: 原始 DataFrame
        name_col_index: 标识列的索引（整数位置）或列名
        missing_strategy: 缺失值处理策略，'drop' 或 sklearn SimpleImputer 支持的策略
        standardize: 是否标准化

    返回: clean_df
    """
    # 标识列处理
    if isinstance(name_col_index, str):
        name_col = name_col_index
        name_data = df[[name_col]]
        numeric_cols = [c for c in df.columns if c != name_col]
    else:
        name_col = df.columns[name_col_index]
        name_data = df[[name_col]]
        numeric_cols = [c for i, c in enumerate(df.columns) if i != name_col_index]

    # 向量化转换数值列
    numeric_df = pd.DataFrame(index=df.index)
    for col in numeric_cols:
        numeric_df[col] = _clean_series_numeric(df[col])

    # 缺失值处理
    if missing_strategy == "drop":
        numeric_df = numeric_df.dropna()
        name_data = name_data.loc[numeric_df.index]
    else:
        imputer = SimpleImputer(strategy=missing_strategy)
        numeric_array = imputer.fit_transform(numeric_df)
        numeric_df = pd.DataFrame(numeric_array, columns=numeric_df.columns, index=numeric_df.index)
   
    # 删除填充后残留的空缺值
    nan_rows_before = numeric_df.isna().any(axis=1).sum()
    if nan_rows_before > 0:
        numeric_df = numeric_df.dropna()
        name_data = name_data.loc[numeric_df.index]
        print(f"警告：填充后仍有 {nan_rows_before} 行包含 NaN，已删除。")

    # 标准化
    if standardize:
        scaler = StandardScaler()
        numeric_array = scaler.fit_transform(numeric_df)
        numeric_df = pd.DataFrame(numeric_array, columns=numeric_df.columns, index=numeric_df.index)
        result = pd.concat([name_data, numeric_df], axis=1)
    else:
        result = pd.concat([name_data, numeric_df], axis=1)

    return result


def auto_clean(input_path: str, output_path: str = None) -> str:
    """从 input_path 读 CSV，自动清洗后写入 output_path。

    自动检测编码与分隔符，先做类型转换（clean_to_numeric），
    再用均值填补缺失值（不做标准化）。

    返回: output_path
    """
    df = None
    for enc in ("utf-8", "utf-8-sig", "gbk", "gb18030"):
        try:
            df = pd.read_csv(input_path, encoding=enc, sep=None, engine="python")
            break
        except Exception:
            continue
    if df is None:
        raise ValueError(f"无法读取文件: {input_path}")

    cleaned = clean_dataframe(df, standardize=False)
    if output_path is None:
        base, ext = os.path.splitext(input_path)
        output_path = f"{base}.cleaned{ext}"
    cleaned.to_csv(output_path, index=False, encoding="utf-8-sig")
    return output_path

import io
from typing import Dict, List, Tuple

import numpy as np
import pandas as pd
import matplotlib.pyplot as plt
from scipy.cluster.hierarchy import linkage, fcluster, dendrogram
from sklearn.cluster import KMeans
from sklearn.metrics import silhouette_score, calinski_harabasz_score, davies_bouldin_score


HIERARCHICAL_METHODS = ["single", "complete", "average", "centroid", "median", "ward"]


def _read_numeric_data(data_path: str) -> Tuple[pd.DataFrame, np.ndarray]:
    df = pd.read_csv(data_path)
    num_df = df.select_dtypes(include=[np.number]).dropna(axis=0)
    if num_df.empty:
        raise ValueError("未检测到可用于聚类的数值列，请上传包含数值列的 CSV/Excel。")
    return df, num_df.to_numpy(dtype=float)


def _standardize(x: np.ndarray) -> np.ndarray:
    mean = x.mean(axis=0, keepdims=True)
    std = x.std(axis=0, keepdims=True)
    std[std == 0] = 1.0
    return (x - mean) / std


def _pca2(x: np.ndarray) -> np.ndarray:
    x0 = x - x.mean(axis=0, keepdims=True)
    cov = np.cov(x0, rowvar=False)
    eigvals, eigvecs = np.linalg.eigh(cov)
    order = np.argsort(eigvals)[::-1]
    pc = eigvecs[:, order[:2]]
    return x0 @ pc


def _svg_scatter(points2d: np.ndarray, labels: np.ndarray, title: str) -> str:
    fig, ax = plt.subplots(figsize=(8, 5))
    unique = np.unique(labels)
    for k in unique:
        idx = labels == k
        ax.scatter(points2d[idx, 0], points2d[idx, 1], s=36, alpha=0.85, label=f"Cluster {int(k)}")
    ax.set_title(title)
    ax.set_xlabel("PC1")
    ax.set_ylabel("PC2")
    ax.legend(loc="best", fontsize=8)
    ax.grid(alpha=0.2)
    buf = io.BytesIO()
    fig.tight_layout()
    fig.savefig(buf, format="svg")
    plt.close(fig)
    return buf.getvalue().decode("utf-8")


def _svg_dendrogram(z: np.ndarray, title: str) -> str:
    fig, ax = plt.subplots(figsize=(9, 5))
    dendrogram(z, ax=ax, leaf_rotation=0, leaf_font_size=10)
    ax.set_title(title)
    ax.set_xlabel("Samples")
    ax.set_ylabel("Distance")
    buf = io.BytesIO()
    fig.tight_layout()
    fig.savefig(buf, format="svg")
    plt.close(fig)
    return buf.getvalue().decode("utf-8")


def _safe_metrics(x: np.ndarray, labels: np.ndarray) -> Dict[str, str]:
    unique = np.unique(labels)
    if unique.size < 2:
        return {
            "silhouette": "N/A",
            "ch": "N/A",
            "db": "N/A",
            "inertia": "N/A",
        }
    sil = silhouette_score(x, labels)
    ch = calinski_harabasz_score(x, labels)
    db = davies_bouldin_score(x, labels)
    return {
        "silhouette": f"{sil:.4f}",
        "ch": f"{ch:.2f}",
        "db": f"{db:.4f}",
        "inertia": "N/A",
    }


def _kmeans_fit(
    x_std: np.ndarray,
    n_clusters: int = 3,
    init: str = "k-means++",
    max_iter: int = 300,
    algorithm: str = "lloyd",
    random_state: int = 42,
):
    model = KMeans(
        n_clusters=n_clusters,
        init=init,
        max_iter=max_iter,
        algorithm=algorithm,
        random_state=random_state,
        n_init=10,
    )
    labels = model.fit_predict(x_std)
    centers = model.cluster_centers_
    return model, labels, centers


def _cluster_table_from_centers(labels: np.ndarray, centers: np.ndarray) -> Tuple[List[str], List[List[str]]]:
    header = ["簇", "样本数"] + [f"中心{i + 1}" for i in range(centers.shape[1])]
    rows: List[List[str]] = []
    for cid in range(centers.shape[0]):
        count = int(np.sum(labels == cid))
        row = [str(cid + 1), str(count)] + [f"{v:.4f}" for v in centers[cid]]
        rows.append(row)
    return header, rows


def analyze(options=None) -> Dict[str, object]:
    if options is not None and not isinstance(options, dict):
        to_py = getattr(options, "to_py", None)
        if callable(to_py):
            options = to_py()

    algorithm = "kmeans"
    n_clusters = 3
    init = "k-means++"
    max_iter = 300
    loss = "lloyd"
    plot_type = "scatter"
    data_path = None

    if isinstance(options, dict):
        algorithm = str(options.get("algorithm", algorithm)).strip().lower()
        n_clusters = int(options.get("n_clusters", n_clusters))
        init = options.get("init", init)
        max_iter = int(options.get("max_iter", max_iter))
        loss = str(options.get("loss", "lloyd")).strip().lower()
        plot_type = str(options.get("plot_type", "scatter")).strip().lower()
        data_path = options.get("data_path")

    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

    dataset_list = _prepare_datasets(data_path)
    n_clusters = max(2, int(n_clusters))
    max_iter = max(10, int(max_iter))
    algorithm = str(algorithm).strip().lower()
    if algorithm == "kmeans":
        plot_type = "scatter"

    svgs: List[str] = []
    summary_rows: List[List[str]] = []
    metrics_first: Dict[str, str] = {"silhouette": "--", "ch": "--", "db": "--", "inertia": "--"}
    detail_header: List[str] = []
    detail_rows: List[List[str]] = []
    kmeans_rows_raw: List[Tuple[str, int, int, List[float]]] = []
    kmeans_max_dim = 0

    for idx, (sheet_label, x) in enumerate(dataset_list):
        x_std = _standardize(x)
        x2 = _pca2(x_std)

        if algorithm == "kmeans":
            km_algo = loss if loss in {"lloyd", "elkan"} else "lloyd"
            model, labels, centers = _kmeans_fit(
                x_std,
                n_clusters=n_clusters,
                init=init,
                max_iter=max_iter,
                algorithm=km_algo,
            )
            metrics = _safe_metrics(x_std, labels)
            metrics["inertia"] = f"{model.inertia_:.4f}"
            svgs.append(_svg_scatter(x2, labels + 1, f"{sheet_label} - KMeans Clustering (K={n_clusters})"))
            summary_rows.append([sheet_label, metrics["silhouette"], metrics["ch"], metrics["db"], metrics["inertia"]])
            if idx == 0:
                metrics_first = metrics
            kmeans_max_dim = max(kmeans_max_dim, centers.shape[1])
            for cid in range(centers.shape[0]):
                count = int(np.sum(labels == cid))
                kmeans_rows_raw.append((sheet_label, cid + 1, count, [float(v) for v in centers[cid]]))
            continue

        if algorithm == "hierarchical":
            method = loss if loss in HIERARCHICAL_METHODS else "ward"
            z = linkage(x_std, method=method)
            labels = fcluster(z, t=n_clusters, criterion="maxclust")
            metrics = _safe_metrics(x_std, labels)
            if plot_type == "dendrogram":
                svgs.append(_svg_dendrogram(z, f"{sheet_label} - Dendrogram ({method})"))
            else:
                svgs.append(_svg_scatter(x2, labels, f"{sheet_label} - Hierarchical Clustering ({method}) (K={n_clusters})"))
            summary_rows.append([sheet_label, metrics["silhouette"], metrics["ch"], metrics["db"], "N/A"])
            counts = [int(np.sum(labels == k)) for k in sorted(np.unique(labels))]
            rows = [[method, str(i + 1), str(c)] for i, c in enumerate(counts)]
            if idx == 0:
                metrics_first = metrics
                detail_header = ["sheet", "方法", "簇编号", "样本数"]
            detail_rows.extend([[sheet_label] + r for r in rows])
            continue

        raise ValueError(f"未知算法: {algorithm}")

    if algorithm == "kmeans":
        detail_header = ["sheet", "簇", "样本数"] + [f"中心{i + 1}" for i in range(kmeans_max_dim)]
        for sheet_label, cluster_id, sample_count, center_vals in kmeans_rows_raw:
            center_strs = [f"{v:.4f}" for v in center_vals]
            if len(center_strs) < kmeans_max_dim:
                center_strs.extend([""] * (kmeans_max_dim - len(center_strs)))
            detail_rows.append([sheet_label, str(cluster_id), str(sample_count)] + center_strs)

    summary_header = ["sheet", "轮廓系数", "CH 指数", "DB 指数", "簇内平方和"]
    return {
        "svg": svgs[0] if svgs else "",
        "svgs": svgs,
        "metrics": metrics_first,
        "tables": [
            {"header": detail_header or ["sheet", "信息"], "rows": detail_rows or [["-", "无结果"]]},
            {"header": summary_header, "rows": summary_rows},
        ],
    }


def _prepare_datasets(data_path: str) -> List[Tuple[str, np.ndarray]]:
    df = pd.read_csv(data_path)
    num_df = df.select_dtypes(include=[np.number]).dropna(axis=0)
    if num_df.empty:
        raise ValueError("未检测到可用于聚类的数值列。")
    return [("data", num_df.to_numpy(dtype=float))]


def hierarchical(method: str = "ward", n_clusters: int = 3, data_path: str = None) -> Dict[str, object]:
    if not data_path:
        return {"error": "请先上传数据文件"}
    method = method.lower().strip()
    if method not in HIERARCHICAL_METHODS:
        raise ValueError(f"method 必须为 {HIERARCHICAL_METHODS} 之一")
    _, x = _read_numeric_data(data_path)
    x_std = _standardize(x)
    x2 = _pca2(x_std)
    z = linkage(x_std, method=method)
    labels = fcluster(z, t=n_clusters, criterion="maxclust")
    metrics = _safe_metrics(x_std, labels)
    counts = [int(np.sum(labels == k)) for k in sorted(np.unique(labels))]
    header = ["方法", "簇编号", "样本数"]
    rows = [[method, str(i + 1), str(c)] for i, c in enumerate(counts)]
    return {
        "svg": _svg_scatter(x2, labels, f"系统聚类({method}) 结果 (K={n_clusters})"),
        "metrics": metrics,
        "tables": [{"header": header, "rows": rows}],
    }


def analyze_all_methods(n_clusters: int = 3, data_path: str = None) -> Dict[str, object]:
    if not data_path:
        return {"error": "请先上传数据文件"}
    _, x = _read_numeric_data(data_path)
    x_std = _standardize(x)

    results: List[List[str]] = []
    for method in HIERARCHICAL_METHODS:
        z = linkage(x_std, method=method)
        labels = fcluster(z, t=n_clusters, criterion="maxclust")
        m = _safe_metrics(x_std, labels)
        results.append([method, m["silhouette"], m["ch"], m["db"], "N/A"])

    km, labels, _ = _kmeans_fit(x_std, n_clusters=n_clusters)
    m = _safe_metrics(x_std, labels)
    results.append(["kmeans", m["silhouette"], m["ch"], m["db"], f"{km.inertia_:.4f}"])

    return {
        "tables": [{"header": ["方法", "轮廓系数", "CH 指数", "DB 指数", "簇内平方和"], "rows": results}],
    }

  <script type="text/python-src" data-module="Evaluation">
import pandas as pd
import numpy as np
from scipy import stats
import matplotlib.pyplot as plt
from io import BytesIO


def _read_data(data_path):
    print(f'[Evaluation] 读取: {data_path}')
    df = pd.read_csv(data_path)
    print(f'[Evaluation] 数据形状: {df.shape}')
    return df


def _ensure_dict(obj):
    if obj is not None and not isinstance(obj, dict):
        obj = obj.to_py()
    return obj or {}


def descriptive(options):
    options = _ensure_dict(options)
    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
    print(f'[描述性统计] 参数: column={options.get("column", "全部")}')
    try:
        df = _read_data(data_path)
        column = options.get('column') or None

        if column and column in df.columns:
            data = df[column].dropna()
            if len(data) == 0:
                return {"error": f"列 '{column}' 没有有效数据"}
            s = _calc_stats(data)
            print(f'[描述性统计] {column}: 均值={s["mean"]}, 标准差={s["std"]}, 样本量={s["n"]}')
            desc_table = [
                ['样本量', s['n']],
                ['均值', s['mean']],
                ['中位数', s['median']],
                ['标准差', s['std']],
                ['方差', s['var']],
                ['最小值', s['min']],
                ['最大值', s['max']],
                ['偏度', s['skew']],
                ['峰度', s['kurtosis']],
            ]
            return {
                "tables": [{"header": ['统计指标', column], "rows": desc_table}],
                "metrics": {"样本量": s['n'], "均值": s['mean'], "中位数": s['median'], "标准差": s['std']},
            }

        numeric_cols = df.select_dtypes(include=[np.number]).columns.tolist()
        if not numeric_cols:
            return {"error": "数据中没有数值类型的列"}

        results = []
        for col in numeric_cols:
            data = df[col].dropna()
            if len(data) > 0:
                results.append({"name": col, **_calc_stats(data)})

        metric_names = ['样本量', '均值', '中位数', '标准差', '最小值', '最大值']
        table_header = ['统计指标'] + [r['name'] for r in results]
        table = []
        for m in metric_names:
            row = [m]
            for r in results:
                val = r.get(m, '-')
                if isinstance(val, float):
                    val = round(val, 4)
                row.append(val)
            table.append(row)

        print(f'[描述性统计] 完成: {len(results)} 个数值变量')
        return {
            "tables": [{"header": table_header, "rows": table}],
            "metrics": {"样本量": len(df), "均值": len(numeric_cols), "中位数": "", "标准差": ""},
        }
    except Exception as e:
        return {"error": f"描述性统计失败: {e}"}


def _calc_stats(data):
    return {
        "n": len(data),
        "mean": round(data.mean(), 4),
        "median": round(data.median(), 4),
        "std": round(data.std(), 4),
        "var": round(data.var(), 4),
        "min": round(data.min(), 4),
        "max": round(data.max(), 4),
        "skew": round(data.skew(), 4),
        "kurtosis": round(data.kurtosis(), 4),
    }


def normality(options):
    options = _ensure_dict(options)
    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
    print(f'[正态性检验] 参数: column={options.get("column", "全部")}, alpha={options.get("alpha", 0.05)}')
    try:
        df = _read_data(data_path)
        column = options.get('column') or None
        alpha = float(options.get('alpha', 0.05))

        if not column:
            numeric_cols = df.select_dtypes(include=[np.number]).columns.tolist()
            if not numeric_cols:
                return {"error": "数据中没有数值类型的列"}
            results = []
            for col in numeric_cols:
                data = df[col].dropna()
                if len(data) >= 3:
                    stat, p = stats.shapiro(data)
                    results.append({
                        "name": col, "n": len(data),
                        "statistic": round(stat, 4), "p_value": round(p, 4),
                        "is_normal": "是" if p >= alpha else "否",
                    })
            norm_table = [[r['name'], r['n'], r['statistic'], r['p_value'], r['is_normal']] for r in results]
            print(f'[正态性检验] 完成: {len(results)} 个变量')
            return {
                "tables": [{"header": ['变量名', '样本量', 'W统计量', 'p值', '正态分布'], "rows": norm_table}],
                "metrics": {"W统计量": len(results), "p值": alpha, "正态性": f"{len(results)}个变量", "显著性水平": alpha},
            }

        if column not in df.columns:
            return {"error": f"列 '{column}' 不存在"}

        data = df[column].dropna()
        if len(data) < 3:
            return {"error": "样本量不足（需要至少3个）"}

        stat, p = stats.shapiro(data)
        is_normal = p >= alpha
        svg = _generate_qq_plot(data, column)
        print(f'[正态性检验] {column}: W={stat:.4f}, p={p:.4f}, {"服从" if is_normal else "不服从"}正态分布')
        norm_table = [
            ['Shapiro-Wilk检验', round(stat, 4), round(p, 4),
             f"{'服从正态分布' if is_normal else '不服从正态分布'} (α={alpha})"],
        ]
        return {
            "tables": [{"header": ['检验项目', '统计量', 'p值', '结论'], "rows": norm_table}],
            "svg": svg,
            "metrics": {"W统计量": round(stat, 4), "p值": round(p, 4), "正态性": "服从" if is_normal else "不服从", "显著性水平": alpha},
        }
    except Exception as e:
        return {"error": f"正态性检验失败: {e}"}


def _generate_qq_plot(data, name):
    try:
        fig, ax = plt.subplots(figsize=(8, 6))
        stats.probplot(data, dist="norm", plot=ax)
        ax.set_title(f'Q-Q Plot: {name}', fontsize=14)
        ax.set_xlabel('理论分位数')
        ax.set_ylabel('样本分位数')
        ax.grid(True, alpha=0.3)
        buf = BytesIO()
        fig.savefig(buf, format='svg', bbox_inches='tight')
        plt.close(fig)
        return buf.getvalue().decode('utf-8')
    except Exception as e:
        print(f"Q-Q图生成失败: {e}")
        return None


def anova(options):
    options = _ensure_dict(options)
    data_path = options.get('data_path')
    if not data_path:
        return {"error": "请先在左侧上传数据文件"}
    print(f'[方差分析] 参数: dependent_var={options.get("dependent_var")}, group_var={options.get("group_var")}')
    try:
        df = _read_data(data_path)
        dependent = options.get('dependent_var') or None
        group = options.get('group_var') or None

        if not dependent or not group:
            return {"error": "请指定因变量和分组变量"}
        if dependent not in df.columns:
            return {"error": f"因变量 '{dependent}' 不存在"}
        if group not in df.columns:
            return {"error": f"分组变量 '{group}' 不存在"}

        groups = []
        group_names = []
        for name, gdf in df.groupby(group):
            vals = gdf[dependent].dropna().values
            if len(vals) > 0:
                groups.append(vals)
                group_names.append(str(name))

        if len(groups) < 2:
            return {"error": "分组数量不足（需要至少2组）"}

        f_stat, p_value = stats.f_oneway(*groups)

        table = []
        for i, (name, g) in enumerate(zip(group_names, groups)):
            table.append([name, len(g), round(g.mean(), 4), round(g.std(), 4)])

        # ANOVA 方差分析表
        all_vals = np.concatenate(groups)
        grand_mean = all_vals.mean()
        ss_between = sum(len(g) * (g.mean() - grand_mean) ** 2 for g in groups)
        ss_within = sum(sum((x - g.mean()) ** 2 for x in g) for g in groups)
        df_between = len(groups) - 1
        df_within = len(all_vals) - len(groups)
        ms_between = ss_between / df_between if df_between > 0 else 0
        ms_within = ss_within / df_within if df_within > 0 else 0

        anova_table = [
            ['组间', round(ss_between, 4), df_between, round(ms_between, 4), round(f_stat, 4), round(p_value, 4)],
            ['组内', round(ss_within, 4), df_within, round(ms_within, 4), '-', '-'],
            ['总计', round(ss_between + ss_within, 4), df_between + df_within, '-', '-', '-'],
        ]
        anova_header = ['来源', 'SS', 'df', 'MS', 'F值', 'p值']

        svg = _generate_boxplot(df, dependent, group)
        is_sig = p_value < 0.05
        print(f'[方差分析] {dependent} ~ {group}: F({df_between},{df_within})={f_stat:.4f}, p={p_value:.4f}, {"显著" if is_sig else "不显著"}')
        return {
            "tables": [
                {"header": ['组别', '样本量', '均值', '标准差'], "rows": table},
                {"header": anova_header, "rows": anova_table},
            ],
            "svg": svg,
            "metrics": {"F值": round(f_stat, 4), "p值": round(p_value, 4), "显著性": "显著" if is_sig else "不显著", "组数": len(groups)},
        }
    except Exception as e:
        return {"error": f"方差分析失败: {e}"}


def _generate_boxplot(df, dependent, group):
    try:
        fig, ax = plt.subplots(figsize=(10, 6))
        gd = df.groupby(group)[dependent].apply(list).to_dict()
        data = [v for v in gd.values() if len(v) > 0]
        labels = [str(k) for k, v in gd.items() if len(v) > 0]
        bp = ax.boxplot(data, labels=labels, patch_artist=True)
        for patch in bp['boxes']:
            patch.set_facecolor('lightblue')
        ax.set_title(f'{dependent} ~ {group}', fontsize=14)
        ax.set_xlabel(group, fontsize=12)
        ax.set_ylabel(dependent, fontsize=12)
        ax.grid(True, alpha=0.3)
        buf = BytesIO()
        fig.savefig(buf, format='svg', bbox_inches='tight')
        plt.close(fig)
        return buf.getvalue().decode('utf-8')
    except Exception as e:
        print(f"箱线图生成失败: {e}")
        return None

  <script type="text/python-src" data-module="Pca">
import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
import matplotlib.font_manager as fm
from sklearn.decomposition import PCA as SKPCA
import io


def pca(options):

    if not isinstance(options, dict):
        options = options.to_py()
    n_components = options.get('n_components') or None
    data_path = options.get('data_path')

    if not data_path:
        return {"error": "请先在左侧上传数据文件"}

    try:
        df = pd.read_csv(data_path)
    except Exception as e:
        return {"error": f"读取数据失败: {e}"}

    first_col = df.columns[0]
    if df[first_col].dtype == 'object':
        sample_labels = df[first_col].tolist()
        df_numeric = df.drop(columns=[first_col])
    else:
        sample_labels = [f"sample{i+1}" for i in range(len(df))]
        df_numeric = df.copy()

    df_numeric = df_numeric.select_dtypes(include=[np.number])
    constant_cols = df_numeric.columns[df_numeric.std() < 1e-10].tolist()
    if constant_cols:
        df_numeric = df_numeric.drop(columns=constant_cols)

    feature_names = df_numeric.columns.tolist()
    n_samples, n_features = df_numeric.shape

    if n_features < 2:
        return {"error": f"数值变量仅 {n_features} 个，至少需要 2 个"}

    from sklearn.preprocessing import StandardScaler
    X_scaled = StandardScaler().fit_transform(df_numeric.values)

    

    max_pc = min(n_samples, n_features)
    if n_components is None:
        n_components = min(max_pc, 6)
    else:
        n_components = int(min(n_components, max_pc))

    pca_full = SKPCA()
    pca_full.fit(X_scaled)

    pca_model = SKPCA(n_components=n_components)
    scores = pca_model.fit_transform(X_scaled)
    loadings = pca_model.components_.T
    explained_var = pca_model.explained_variance_ratio_
    cum_var = np.cumsum(explained_var)

    pc_names = [f'PC{i+1}' for i in range(n_components)]

    svgs = []

    # 图1: 方差解释比例柱状图
    fig1, ax1 = plt.subplots(figsize=(8, 4))
    colors1 = plt.cm.Blues(np.linspace(0.4, 0.9, n_components))
    bars = ax1.bar(pc_names, explained_var, color=colors1, edgecolor='#1e3b5c', linewidth=1.2)
    for b, v in zip(bars, explained_var):
        ax1.text(b.get_x() + b.get_width() / 2, b.get_height() + 0.01,
                 f'{v:.1%}', ha='center', va='bottom', fontsize=10, fontweight='bold')
    ax1.set_ylabel('Proportion of variance explained', fontsize=11)
    ax1.set_title('Explained variance ratio for each principal component', fontsize=13, fontweight='bold')
    ax1.set_ylim(0, max(explained_var) * 1.25)
    ax1.grid(axis='y', alpha=0.3, linestyle='--')
    fig1.tight_layout()
    buf = io.BytesIO()
    fig1.savefig(buf, format='svg')
    plt.close(fig1)
    svgs.append(buf.getvalue().decode())

    # 图2: 累积方差折线图
    fig2, ax2 = plt.subplots(figsize=(8, 4))
    cum_var_full = np.cumsum(pca_full.explained_variance_ratio_)
    pc_range = range(1, len(cum_var_full) + 1)
    ax2.plot(pc_range, cum_var_full, 'o--', color='lightgray', markersize=5,
             linewidth=1.5, label='All PCs')
    ax2.plot(range(1, n_components + 1), cum_var, 'o-', color='darkorange',
             markersize=8, linewidth=2.5, label='Selected PCs', zorder=5)
    for th, clr, lbl in [(0.8, 'green', '80%'), (0.9, 'red', '90%'), (0.95, 'purple', '95%')]:
        ax2.axhline(y=th, color=clr, linestyle='--', alpha=0.6, linewidth=1)
        ax2.text(max_pc + 0.3, th, lbl, color=clr, fontsize=9, va='center')
    ax2.set_xlabel('Number of PCs', fontsize=11)
    ax2.set_ylabel('Cumulative explained variance ratio', fontsize=11)
    ax2.set_title('Cumulative explained variance ratio', fontsize=13, fontweight='bold')
    ax2.set_xticks(range(1, max_pc + 1))
    ax2.set_xlim(0.5, max_pc + 1.2)
    ax2.set_ylim(0, 1.05)
    ax2.legend(loc='lower right', fontsize=9)
    ax2.grid(alpha=0.3, linestyle='--')
    fig2.tight_layout()
    buf = io.BytesIO()
    fig2.savefig(buf, format='svg')
    plt.close(fig2)
    svgs.append(buf.getvalue().decode())

    # 图3: 得分散点图
    fig3, ax3 = plt.subplots(figsize=(7, 6))
    if n_components >= 2:
        ax3.scatter(scores[:, 0], scores[:, 1], c='steelblue', edgecolors='#1e3b5c',
                    s=70, alpha=0.75, zorder=3)
        # for i, lbl in enumerate(sample_labels):
        #     ax3.annotate(lbl, (scores[i, 0], scores[i, 1]),
        #                  textcoords="offset points", xytext=(5, 5),
        #                  fontsize=7, alpha=0.85)
        ax3.set_xlabel(f'PC1 ({explained_var[0]:.1%})', fontsize=11)
        ax3.set_ylabel(f'PC2 ({explained_var[1]:.1%})', fontsize=11)
        ax3.set_title('PCA score ', fontsize=13, fontweight='bold')
    else:
        ax3.text(0.5, 0.5, 'Only one PC', transform=ax3.transAxes,
                 ha='center', va='center', fontsize=14, color='gray')
    ax3.axhline(y=0, color='grey', linestyle='--', alpha=0.5, zorder=1)
    ax3.axvline(x=0, color='grey', linestyle='--', alpha=0.5, zorder=1)
    ax3.grid(alpha=0.3, linestyle='--', zorder=0)
    fig3.tight_layout()
    buf = io.BytesIO()
    fig3.savefig(buf, format='svg')
    plt.close(fig3)
    svgs.append(buf.getvalue().decode())

    # 图4: 双标图
    fig4, ax4 = plt.subplots(figsize=(8, 7))
    if n_components >= 2:
        ax4.scatter(scores[:, 0], scores[:, 1], c='steelblue', edgecolors='#1e3b5c',
                    s=50, alpha=0.6, label='samples', zorder=3)
        scale = (np.max(np.abs(scores[:, :2])) * 0.9 /
                 max(np.max(np.abs(loadings[:, :2])), 1e-10))
        for i, vn in enumerate(feature_names):
            ax4.arrow(0, 0, loadings[i, 0] * scale, loadings[i, 1] * scale,
                      head_width=scale * 0.08, head_length=scale * 0.12,
                      fc='crimson', ec='darkred', alpha=0.85, linewidth=1.5, zorder=4)
            ax4.text(loadings[i, 0] * scale * 1.15, loadings[i, 1] * scale * 1.15,
                     vn, color='darkred', fontsize=9, fontweight='bold',
                     ha='center', va='center')
        ax4.set_xlabel(f'PC1 ({explained_var[0]:.1%})', fontsize=11)
        ax4.set_ylabel(f'PC2 ({explained_var[1]:.1%})', fontsize=11)
        ax4.set_title('PCA biplot', fontsize=13, fontweight='bold')
        ax4.legend(loc='upper right', fontsize=9)
    else:
        ax4.text(0.5, 0.5, 'Unable to draw biplot', transform=ax4.transAxes,
                 ha='center', va='center', fontsize=14, color='gray')
    ax4.axhline(y=0, color='grey', linestyle='--', alpha=0.4, zorder=1)
    ax4.axvline(x=0, color='grey', linestyle='--', alpha=0.4, zorder=1)
    ax4.grid(alpha=0.3, linestyle='--', zorder=0)
    fig4.tight_layout()
    buf = io.BytesIO()
    fig4.savefig(buf, format='svg')
    plt.close(fig4)
    svgs.append(buf.getvalue().decode())

    # 载荷矩阵
    table = []
    for i, vn in enumerate(feature_names):
        row = [vn] + [f'{loadings[i, j]:.4f}' for j in range(n_components)]
        table.append(row)
    table_header = ['variable'] + pc_names

    # 得分矩阵
    scores_table = []
    for i, lbl in enumerate(sample_labels):
        row = [lbl] + [f'{scores[i, j]:.4f}' for j in range(n_components)]
        scores_table.append(row)
    scores_header = ['sample'] + pc_names

    return {
        "svgs": svgs,
        "metrics": {
            "samples num": n_samples,
            "variable num": n_features,
            "PC num": n_components,
            "Cumulative variance": f"{cum_var[-1]:.1%}"
        },
        "tables": [
            {"header": table_header, "rows": table},
            {"header": scores_header, "rows": scores_table},
        ],
    }

  </script>
