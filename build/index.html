<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatCore - 多元统计分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sheet-selector {
      background: #f8fafd;
      border: 1px solid #eef1f5;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 28px;
    }
    .sheet-selector-title {
      font-size: 13px;
      font-weight: 500;
      color: #3a4a5a;
      margin-bottom: 10px;
    }
    .sheet-selector-title i {
      color: #2a5c8a;
      margin-right: 6px;
    }
    .sheet-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sheet-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #3e5060;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sheet-option:hover {
      background: #e7f0fa;
    }
    .sheet-option input[type="radio"] {
      accent-color: #2a5c8a;
    }
    .btn-confirm-sheet {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #2a5c8a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-confirm-sheet:hover {
      background: #1e4b6e;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-chart-scatter"></i></div>
        <div>
          <div class="logo-text">StatCore</div>
          <div class="logo-sub">多元统计分析·课程作业</div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-content">
          <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
          <div class="drop-text">
            <span class="drop-primary">拖拽文件到此处</span>
            <span class="drop-secondary">或</span>
            <label class="browse-btn">
              浏览文件<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
            </label>
          </div>
          <div class="drop-hint">支持 CSV、Excel 文件</div>
        </div>
      </div>

      <div id="sheetSelector" class="sheet-selector" style="display:none;">
        <div class="sheet-selector-title"><i class="fas fa-file-excel"></i> 选择要导入的工作表</div>
        <div id="sheetOptions" class="sheet-options"></div>
        <button id="confirmSheet" class="btn-confirm-sheet">确认导入</button>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-module="clustering"><i class="fas fa-layer-group"></i> 聚类分析</button>
        <button class="nav-item" data-module="visualization"><i class="fas fa-flask"></i> 可视化</button>
        <button class="nav-item" data-module="Evaluation"><i class="fas fa-chart-bar"></i> 统计评价</button>
        <button class="nav-item" data-module="pca"><i class="fas fa-arrow-down-wide-short"></i> 主成分分析</button>
        <button class="nav-item" data-module="factor"><i class="fas fa-cube"></i> 因子分析</button>

        <button class="nav-item" data-module="extended"><i class="fas fa-plus-minus"></i> 扩展线性</button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-module="python"><i class="fas fa-code"></i> Python 代码</button>
      </nav>

      <div class="sidebar-footer">
        <i class="far fa-lightbulb"></i> 浏览器端 Python · Pyodide<br>
        <span style="opacity:0.7;">所有计算在本地 WebAssembly 中完成</span>
        <div class="py-status" style="margin-top:8px; font-size:12px; color:#8a9aaa;">
          <i class="fas fa-spinner fa-pulse"></i> 加载 Pyodide 中...
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
          <div class="progress-text"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="module-loading" style="text-align:center; padding:80px 20px; color:#8a9aaa;">
        <i class="fas fa-spinner fa-pulse fa-2x"></i>
        <p style="margin-top:16px;">加载模块中...</p>
      </div>

    <span style="color: #F8F8F2">failed_vals</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">replace(</span><span style="color: #E6DB74">r&#39;%&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&#39;&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">regex</span><span style="color: #FF4689">=</span><span style="color: #66D9EF">True</span><span style="color: #F8F8F2">)</span>
    
    <span style="color: #959077"># 6. 移除千位分隔符（逗号）和空格（只移除数字内部的空格，保守处理）</span>
    <span style="color: #F8F8F2">failed_vals</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">replace(</span><span style="color: #E6DB74">&#39;,&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&#39;&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">regex</span><span style="color: #FF4689">=</span><span style="color: #66D9EF">False</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">failed_vals</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_vals</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">str</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">replace(</span><span style="color: #E6DB74">&#39; &#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&#39;&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">regex</span><span style="color: #FF4689">=</span><span style="color: #66D9EF">False</span><span style="color: #F8F8F2">)</span>
    
    <span style="color: #959077"># 第二次转数值</span>
    <span style="color: #F8F8F2">cleaned_numeric</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_numeric(failed_vals,</span> <span style="color: #F8F8F2">errors</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;coerce&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">downcast</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;float&#39;</span><span style="color: #F8F8F2">)</span>
    
    <span style="color: #959077"># 百分比除以100</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">pct_mask</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">any():</span>
        <span style="color: #959077"># pct_mask 索引对应原始 failed_mask 内的子集，需要对齐</span>
        <span style="color: #959077"># 在 cleaned_numeric 上，根据原始的带%标记来调整</span>
        <span style="color: #F8F8F2">pct_mask_full</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">failed_mask</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">copy()</span>
        <span style="color: #F8F8F2">pct_mask_full[failed_mask]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pct_mask</span>
        <span style="color: #F8F8F2">numeric</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[pct_mask_full]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">cleaned_numeric</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[pct_mask]</span> <span style="color: #FF4689">/</span> <span style="color: #AE81FF">100.0</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">numeric</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[failed_mask]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">cleaned_numeric</span>
    
    <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">numeric</span>


<span style="color: #66D9EF">def</span><span style="color: #F8F8F2"> </span><span style="color: #A6E22E">clean_dataframe</span><span style="color: #F8F8F2">(</span>
    <span style="color: #F8F8F2">df:</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame,</span>
    <span style="color: #F8F8F2">name_col_index:</span> <span style="color: #F8F8F2">Union[int,</span> <span style="color: #F8F8F2">str]</span> <span style="color: #FF4689">=</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span>
    <span style="color: #F8F8F2">missing_strategy:</span> <span style="color: #F8F8F2">str</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;mean&quot;</span><span style="color: #F8F8F2">,</span>
    <span style="color: #F8F8F2">standardize:</span> <span style="color: #F8F8F2">bool</span> <span style="color: #FF4689">=</span> <span style="color: #66D9EF">True</span>
<span style="color: #F8F8F2">)</span> <span style="color: #FF4689">-&gt;</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame:</span>
<span style="color: #F8F8F2">    </span><span style="color: #E6DB74">&quot;&quot;&quot;</span>
<span style="color: #E6DB74">    清洗数据框中的数值列，保留一列标识列（如名称）。</span>
<span style="color: #E6DB74"> </span>
<span style="color: #E6DB74">    参数:</span>
<span style="color: #E6DB74">        df: 原始 DataFrame</span>
<span style="color: #E6DB74">        name_col_index: 标识列的索引（整数位置）或列名</span>
<span style="color: #E6DB74">        missing_strategy: 缺失值处理策略，&#39;drop&#39; 或 sklearn SimpleImputer 支持的策略</span>
<span style="color: #E6DB74">        standardize: 是否标准化</span>

<span style="color: #E6DB74">    返回: clean_df</span>
<span style="color: #E6DB74">    &quot;&quot;&quot;</span>
    <span style="color: #959077"># 标识列处理</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">isinstance(name_col_index,</span> <span style="color: #F8F8F2">str):</span>
        <span style="color: #F8F8F2">name_col</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_col_index</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[[name_col]]</span>
        <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">!=</span> <span style="color: #F8F8F2">name_col]</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">name_col</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns[name_col_index]</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[[name_col]]</span>
        <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns)</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">!=</span> <span style="color: #F8F8F2">name_col_index]</span>

    <span style="color: #959077"># 向量化转换数值列</span>
    <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">col</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">numeric_cols:</span>
        <span style="color: #F8F8F2">numeric_df[col]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">_clean_series_numeric(df[col])</span>

    <span style="color: #959077"># 缺失值处理</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">missing_strategy</span> <span style="color: #FF4689">==</span> <span style="color: #E6DB74">&quot;drop&quot;</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">dropna()</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_data</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index]</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">imputer</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">SimpleImputer(strategy</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">missing_strategy)</span>
        <span style="color: #F8F8F2">numeric_array</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">imputer</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(numeric_df)</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(numeric_array,</span> <span style="color: #F8F8F2">columns</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns,</span> <span style="color: #F8F8F2">index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>
   
    <span style="color: #959077"># 删除填充后残留的空缺值</span>
    <span style="color: #F8F8F2">nan_rows_before</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">isna()</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">any(axis</span><span style="color: #FF4689">=</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">)</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">sum()</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">nan_rows_before</span> <span style="color: #FF4689">&gt;</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">dropna()</span>
        <span style="color: #F8F8F2">name_data</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">name_data</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">loc[numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index]</span>
        <span style="color: #F8F8F2">print(</span><span style="color: #E6DB74">f&quot;警告：填充后仍有 {</span><span style="color: #F8F8F2">nan_rows_before</span><span style="color: #E6DB74">} 行包含 NaN，已删除。&quot;</span><span style="color: #F8F8F2">)</span>

    <span style="color: #959077"># 标准化</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">standardize:</span>
        <span style="color: #F8F8F2">scaler</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">StandardScaler()</span>
        <span style="color: #F8F8F2">numeric_array</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">scaler</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(numeric_df)</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(numeric_array,</span> <span style="color: #F8F8F2">columns</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns,</span> <span style="color: #F8F8F2">index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>
        <span style="color: #F8F8F2">result</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">concat([name_data,</span> <span style="color: #F8F8F2">numeric_df],</span> <span style="color: #F8F8F2">axis</span><span style="color: #FF4689">=</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">)</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">result</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">concat([name_data,</span> <span style="color: #F8F8F2">numeric_df],</span> <span style="color: #F8F8F2">axis</span><span style="color: #FF4689">=</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">)</span>

    <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">result</span>


<span style="color: #66D9EF">def</span><span style="color: #F8F8F2"> </span><span style="color: #A6E22E">preview_data</span><span style="color: #F8F8F2">(options):</span>
<span style="color: #F8F8F2">    </span><span style="color: #E6DB74">&quot;&quot;&quot;快速返回数据预览信息（只读前 1000 行）</span>

<span style="color: #E6DB74">    接受参数:</span>
<span style="color: #E6DB74">        data_path: CSV 文件路径</span>

<span style="color: #E6DB74">    返回:</span>
<span style="color: #E6DB74">        columns: 列名列表</span>
<span style="color: #E6DB74">        dtypes: {列名: 类型字符串}</span>
<span style="color: #E6DB74">        sample: 前 5 行数据（字符串二维数组）</span>
<span style="color: #E6DB74">        n_rows: 总行数</span>
<span style="color: #E6DB74">        suggested_roles: {列名: &quot;index&quot;|&quot;numeric&quot;|&quot;categorical&quot;}</span>
<span style="color: #E6DB74">    &quot;&quot;&quot;</span>
    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">isinstance(options,</span> <span style="color: #F8F8F2">dict):</span>
        <span style="color: #F8F8F2">options</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_py()</span>
    <span style="color: #F8F8F2">data_path</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;data_path&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">data_path:</span>
        <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">&quot;未指定数据路径&quot;</span><span style="color: #F8F8F2">}</span>

    <span style="color: #FF4689">import</span><span style="color: #F8F8F2"> csv</span>

    <span style="color: #959077"># 编码检测 + CSV 行数</span>
    <span style="color: #F8F8F2">columns</span> <span style="color: #FF4689">=</span> <span style="color: #66D9EF">None</span>
    <span style="color: #F8F8F2">n_rows</span> <span style="color: #FF4689">=</span> <span style="color: #AE81FF">0</span>
    <span style="color: #F8F8F2">detected_enc</span> <span style="color: #FF4689">=</span> <span style="color: #66D9EF">None</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">enc</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">(</span><span style="color: #E6DB74">&quot;utf-8&quot;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&quot;utf-8-sig&quot;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&quot;gbk&quot;</span><span style="color: #F8F8F2">,</span> <span style="color: #E6DB74">&quot;gb18030&quot;</span><span style="color: #F8F8F2">):</span>
        <span style="color: #66D9EF">try</span><span style="color: #F8F8F2">:</span>
            <span style="color: #66D9EF">with</span> <span style="color: #F8F8F2">open(data_path,</span> <span style="color: #F8F8F2">encoding</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">enc,</span> <span style="color: #F8F8F2">newline</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;&#39;</span><span style="color: #F8F8F2">)</span> <span style="color: #66D9EF">as</span> <span style="color: #F8F8F2">f:</span>
                <span style="color: #F8F8F2">reader</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">csv</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">reader(f)</span>
                <span style="color: #F8F8F2">columns</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">next(reader)</span>
                <span style="color: #F8F8F2">n_rows</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">sum(</span><span style="color: #AE81FF">1</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">_</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">reader)</span>
            <span style="color: #F8F8F2">detected_enc</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">enc</span>
            <span style="color: #66D9EF">break</span>
        <span style="color: #66D9EF">except</span> <span style="color: #A6E22E">Exception</span><span style="color: #F8F8F2">:</span>
            <span style="color: #66D9EF">continue</span>

    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">columns</span> <span style="color: #FF4689">is</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">:</span>
        <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">f&quot;无法读取文件: {</span><span style="color: #F8F8F2">data_path</span><span style="color: #E6DB74">}&quot;</span><span style="color: #F8F8F2">}</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">n_rows</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
        <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">&quot;空文件&quot;</span><span style="color: #F8F8F2">}</span>

    <span style="color: #959077"># pandas 读前 1000 行</span>
    <span style="color: #F8F8F2">df_sample</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">read_csv(data_path,</span> <span style="color: #F8F8F2">nrows</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">min(</span><span style="color: #AE81FF">1000</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">n_rows</span> <span style="color: #FF4689">+</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">),</span> <span style="color: #F8F8F2">encoding</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">detected_enc)</span>

    <span style="color: #959077"># 前 5 行预览</span>
    <span style="color: #F8F8F2">sample</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">_,</span> <span style="color: #F8F8F2">row</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">df_sample</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">head(</span><span style="color: #AE81FF">5</span><span style="color: #F8F8F2">)</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">iterrows():</span>
        <span style="color: #F8F8F2">sample</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append([</span><span style="color: #E6DB74">&quot;&quot;</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">isna(v)</span> <span style="color: #66D9EF">else</span> <span style="color: #F8F8F2">str(v)</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">v</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">row])</span>

    <span style="color: #959077"># 类型推断 + 角色建议</span>
    <span style="color: #F8F8F2">actual_columns</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df_sample</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">tolist()</span>
    <span style="color: #F8F8F2">dtypes</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">{}</span>
    <span style="color: #F8F8F2">suggested_roles</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">{}</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">col</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(actual_columns):</span>
        <span style="color: #F8F8F2">dtype_str</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">str(df_sample[col]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">dtype)</span>
        <span style="color: #F8F8F2">dtypes[col]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">dtype_str</span>
        <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
            <span style="color: #F8F8F2">suggested_roles[col]</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;index&quot;</span>
        <span style="color: #66D9EF">elif</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">api</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">types</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">is_numeric_dtype(df_sample[col]):</span>
            <span style="color: #F8F8F2">suggested_roles[col]</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;numeric&quot;</span>
        <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
            <span style="color: #F8F8F2">suggested_roles[col]</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;categorical&quot;</span>

    <span style="color: #959077"># 补上 csv reader 发现但 pd.read_csv(nrows) 未发现的列</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">col</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">columns:</span>
        <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">col</span> <span style="color: #FF4689">not</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">dtypes:</span>
            <span style="color: #F8F8F2">dtypes[col]</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;unknown&quot;</span>
            <span style="color: #F8F8F2">suggested_roles[col]</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;categorical&quot;</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">columns</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index(col)</span> <span style="color: #FF4689">&gt;</span> <span style="color: #AE81FF">0</span> <span style="color: #66D9EF">else</span> <span style="color: #E6DB74">&quot;index&quot;</span>

    <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span>
        <span style="color: #E6DB74">&quot;columns&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #F8F8F2">columns,</span>
        <span style="color: #E6DB74">&quot;dtypes&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #F8F8F2">dtypes,</span>
        <span style="color: #E6DB74">&quot;sample&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #F8F8F2">sample,</span>
        <span style="color: #E6DB74">&quot;n_rows&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #F8F8F2">n_rows,</span>
        <span style="color: #E6DB74">&quot;suggested_roles&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #F8F8F2">suggested_roles,</span>
    <span style="color: #F8F8F2">}</span>


<span style="color: #66D9EF">def</span><span style="color: #F8F8F2"> </span><span style="color: #A6E22E">manual_clean</span><span style="color: #F8F8F2">(options):</span>
<span style="color: #F8F8F2">    </span><span style="color: #E6DB74">&quot;&quot;&quot;根据用户指定的列角色清洗数据</span>

<span style="color: #E6DB74">    接受参数:</span>
<span style="color: #E6DB74">        data_path: 原始 CSV 路径</span>
<span style="color: #E6DB74">        index_col: 索引列名（保留原样，不做数值处理）</span>
<span style="color: #E6DB74">        numeric_cols: 数值列名列表（清洗 + 均值填补）</span>
<span style="color: #E6DB74">        categorical_cols: 分类列名列表（保留原样）</span>

<span style="color: #E6DB74">    返回:</span>
<span style="color: #E6DB74">        path: 清洗后文件路径</span>
<span style="color: #E6DB74">        columns: 总列数</span>
<span style="color: #E6DB74">        numeric_columns: 数值列数</span>
<span style="color: #E6DB74">        categorical_columns: 分类列数</span>
<span style="color: #E6DB74">        rows: 行数</span>
<span style="color: #E6DB74">    &quot;&quot;&quot;</span>
    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">isinstance(options,</span> <span style="color: #F8F8F2">dict):</span>
        <span style="color: #F8F8F2">options</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_py()</span>

    <span style="color: #F8F8F2">data_path</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;data_path&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">index_col</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;index_col&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;numeric_cols&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">[])</span>
    <span style="color: #F8F8F2">categorical_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;categorical_cols&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">[])</span>

    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">hasattr(numeric_cols,</span> <span style="color: #E6DB74">&#39;to_py&#39;</span><span style="color: #F8F8F2">):</span>
        <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_cols</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_py()</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">hasattr(categorical_cols,</span> <span style="color: #E6DB74">&#39;to_py&#39;</span><span style="color: #F8F8F2">):</span>
        <span style="color: #F8F8F2">categorical_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">categorical_cols</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_py()</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">isinstance(index_col,</span> <span style="color: #F8F8F2">list):</span>
        <span style="color: #F8F8F2">index_col</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">index_col[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">index_col</span> <span style="color: #66D9EF">else</span> <span style="color: #66D9EF">None</span>

    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">data_path:</span>
        <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">&quot;未指定数据路径&quot;</span><span style="color: #F8F8F2">}</span>

    <span style="color: #F8F8F2">df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">_read_csv(data_path)</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">df</span> <span style="color: #FF4689">is</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">:</span>
        <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">f&quot;无法读取文件: {</span><span style="color: #F8F8F2">data_path</span><span style="color: #E6DB74">}&quot;</span><span style="color: #F8F8F2">}</span>

    <span style="color: #959077"># 分离索引列</span>
    <span style="color: #F8F8F2">index_df</span> <span style="color: #FF4689">=</span> <span style="color: #66D9EF">None</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">index_col</span> <span style="color: #FF4689">and</span> <span style="color: #F8F8F2">index_col</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns:</span>
        <span style="color: #F8F8F2">index_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[[index_col]]</span>

    <span style="color: #959077"># 数值列清洗</span>
    <span style="color: #F8F8F2">valid_numeric</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns]</span>
    <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">col</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">valid_numeric:</span>
        <span style="color: #F8F8F2">numeric_df[col]</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">_clean_series_numeric(df[col])</span>

    <span style="color: #959077"># 均值填补（只对有实际数值的列）</span>
    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">empty</span> <span style="color: #FF4689">and</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">shape[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span> <span style="color: #FF4689">&gt;</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">imputer</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">SimpleImputer(strategy</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;mean&#39;</span><span style="color: #F8F8F2">)</span>
        <span style="color: #F8F8F2">numeric_array</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">imputer</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(numeric_df)</span>
        <span style="color: #F8F8F2">numeric_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(numeric_array,</span> <span style="color: #F8F8F2">columns</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns,</span> <span style="color: #F8F8F2">index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>

    <span style="color: #959077"># 分类列保留原样</span>
    <span style="color: #F8F8F2">valid_cat</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">categorical_cols</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">columns]</span>
    <span style="color: #F8F8F2">cat_df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[valid_cat]</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">valid_cat</span> <span style="color: #66D9EF">else</span> <span style="color: #F8F8F2">pd</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">DataFrame(index</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">index)</span>

    <span style="color: #959077"># 重组</span>
    <span style="color: #F8F8F2">parts</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">index_df</span> <span style="color: #FF4689">is</span> <span style="color: #FF4689">not</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">parts</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(index_df)</span>
    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">numeric_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">empty:</span>
        <span style="color: #F8F8F2">parts</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(numeric_df)</span>
    <span style="color: #66D9EF">if</span> <span style="color: #FF4689">not</span> <span style="color: #F8F8F2">cat_df</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">empty:</span>

    <span style="color: #959077"># 5. 获取用户指定的 X/Y 列名（来自前端双选框）</span>
    <span style="color: #F8F8F2">x_cols_param</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;x_cols&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">y_cols_param</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">options</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">get(</span><span style="color: #E6DB74">&#39;y_cols&#39;</span><span style="color: #F8F8F2">,</span> <span style="color: #66D9EF">None</span><span style="color: #F8F8F2">)</span>

    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">x_cols_param</span> <span style="color: #FF4689">and</span> <span style="color: #F8F8F2">y_cols_param:</span>
        <span style="color: #959077"># 用户指定了分组</span>
        <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">hasattr(x_cols_param,</span> <span style="color: #E6DB74">&#39;to_py&#39;</span><span style="color: #F8F8F2">):</span>
            <span style="color: #F8F8F2">x_cols_param</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">x_cols_param</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_py()</span>
        <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">hasattr(y_cols_param,</span> <span style="color: #E6DB74">&#39;to_py&#39;</span><span style="color: #F8F8F2">):</span>
            <span style="color: #F8F8F2">y_cols_param</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">y_cols_param</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">to_py()</span>

        <span style="color: #F8F8F2">X_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">x_cols_param]</span>
        <span style="color: #F8F8F2">Y_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[c</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">numeric_cols</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">y_cols_param]</span>

        <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">len(X_cols)</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span> <span style="color: #FF4689">or</span> <span style="color: #F8F8F2">len(Y_cols)</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
            <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">&quot;请至少选择一个X变量和一个Y变量&quot;</span><span style="color: #F8F8F2">}</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #959077"># 兼容旧行为：自动对半分</span>
        <span style="color: #F8F8F2">n</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">len(numeric_cols)</span> <span style="color: #FF4689">//</span> <span style="color: #AE81FF">2</span>
        <span style="color: #F8F8F2">X_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_cols[:n]</span>
        <span style="color: #F8F8F2">Y_cols</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">numeric_cols[n:]</span>

        <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">len(X_cols)</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span> <span style="color: #FF4689">or</span> <span style="color: #F8F8F2">len(Y_cols)</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
            <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">&quot;分组后 X 或 Y 组为空，请检查数据列数&quot;</span><span style="color: #F8F8F2">}</span>

    <span style="color: #959077"># 6. 样本量校验</span>
    <span style="color: #F8F8F2">n_samples</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">len(df)</span>
    <span style="color: #F8F8F2">n_vars_x</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">len(X_cols)</span>
    <span style="color: #F8F8F2">n_vars_y</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">len(Y_cols)</span>

    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">n_samples</span> <span style="color: #FF4689">&lt;=</span> <span style="color: #F8F8F2">n_vars_x</span> <span style="color: #FF4689">or</span> <span style="color: #F8F8F2">n_samples</span> <span style="color: #FF4689">&lt;=</span> <span style="color: #F8F8F2">n_vars_y:</span>
        <span style="color: #66D9EF">return</span> <span style="color: #F8F8F2">{</span><span style="color: #E6DB74">&quot;error&quot;</span><span style="color: #F8F8F2">:</span> <span style="color: #E6DB74">f&quot;样本量 ({</span><span style="color: #F8F8F2">n_samples</span><span style="color: #E6DB74">}) 必须大于变量数 (X:{</span><span style="color: #F8F8F2">n_vars_x</span><span style="color: #E6DB74">}, Y:{</span><span style="color: #F8F8F2">n_vars_y</span><span style="color: #E6DB74">})&quot;</span><span style="color: #F8F8F2">}</span>

    <span style="color: #959077"># 7. 提取数据并进行标准化（CCA 必须标准化）</span>
    <span style="color: #F8F8F2">X</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[X_cols]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">values</span>
    <span style="color: #F8F8F2">Y</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">df[Y_cols]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">values</span>

    <span style="color: #F8F8F2">scaler</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">StandardScaler()</span>
    <span style="color: #F8F8F2">X_std</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">scaler</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(X)</span>
    <span style="color: #F8F8F2">Y_std</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">scaler</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit_transform(Y)</span>

    <span style="color: #959077"># 8. CCA 计算</span>
    <span style="color: #F8F8F2">n_components</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">min(n_vars_x,</span> <span style="color: #F8F8F2">n_vars_y)</span>
    <span style="color: #F8F8F2">cca</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">CCA(n_components</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">n_components)</span>
    <span style="color: #F8F8F2">cca</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">fit(X_std,</span> <span style="color: #F8F8F2">Y_std)</span>

    <span style="color: #959077"># 9. 获取典型变量得分</span>
    <span style="color: #F8F8F2">X_c,</span> <span style="color: #F8F8F2">Y_c</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">cca</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">transform(X_std,</span> <span style="color: #F8F8F2">Y_std)</span>

    <span style="color: #959077"># 10. 计算典型相关系数</span>
    <span style="color: #F8F8F2">corrs</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(X_c</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">shape[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]):</span>
        <span style="color: #F8F8F2">corr</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">corrcoef(X_c[:,</span> <span style="color: #F8F8F2">i],</span> <span style="color: #F8F8F2">Y_c[:,</span> <span style="color: #F8F8F2">i])[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span>
        <span style="color: #F8F8F2">corrs</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(round(corr,</span> <span style="color: #AE81FF">4</span><span style="color: #F8F8F2">))</span>

    <span style="color: #959077"># 11. 显著性检验 (Bartlett&#39;s test)</span>
    <span style="color: #F8F8F2">chi2_stats</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #F8F8F2">p_values</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #F8F8F2">n</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">n_samples</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">k</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components):</span>
        <span style="color: #959077"># 计算 Wilks&#39; lambda</span>
        <span style="color: #F8F8F2">lambda_val</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">prod([</span><span style="color: #AE81FF">1</span> <span style="color: #FF4689">-</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">**</span> <span style="color: #AE81FF">2</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">c</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">corrs[k:]])</span>
        <span style="color: #959077"># 卡方统计量</span>
        <span style="color: #F8F8F2">chi2</span> <span style="color: #FF4689">=</span> <span style="color: #FF4689">-</span><span style="color: #F8F8F2">(n</span> <span style="color: #FF4689">-</span> <span style="color: #AE81FF">1</span> <span style="color: #FF4689">-</span> <span style="color: #F8F8F2">(n_vars_x</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">n_vars_y</span> <span style="color: #FF4689">+</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">)</span> <span style="color: #FF4689">/</span> <span style="color: #AE81FF">2</span><span style="color: #F8F8F2">)</span> <span style="color: #FF4689">*</span> <span style="color: #F8F8F2">np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">log(lambda_val)</span>
        <span style="color: #F8F8F2">df</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">(n_vars_x</span> <span style="color: #FF4689">-</span> <span style="color: #F8F8F2">k)</span> <span style="color: #FF4689">*</span> <span style="color: #F8F8F2">(n_vars_y</span> <span style="color: #FF4689">-</span> <span style="color: #F8F8F2">k)</span>
        <span style="color: #F8F8F2">p_val</span> <span style="color: #FF4689">=</span> <span style="color: #AE81FF">1</span> <span style="color: #FF4689">-</span> <span style="color: #F8F8F2">stats</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">chi2</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">cdf(chi2,</span> <span style="color: #F8F8F2">df)</span>
        <span style="color: #F8F8F2">chi2_stats</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(round(chi2,</span> <span style="color: #AE81FF">4</span><span style="color: #F8F8F2">))</span>
        <span style="color: #F8F8F2">p_values</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(round(p_val,</span> <span style="color: #AE81FF">4</span><span style="color: #F8F8F2">))</span>

    <span style="color: #959077"># 12. 获取权重系数</span>
    <span style="color: #F8F8F2">x_weights</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">cca</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">x_weights_</span>
    <span style="color: #F8F8F2">y_weights</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">cca</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">y_weights_</span>

    <span style="color: #959077"># 13. 计算结构载荷 (correlation between original variables and canonical variates)</span>
    <span style="color: #F8F8F2">x_loadings</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #F8F8F2">y_loadings</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components):</span>
        <span style="color: #F8F8F2">x_loadings</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append([np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">corrcoef(X_std[:,</span> <span style="color: #F8F8F2">j],</span> <span style="color: #F8F8F2">X_c[:,</span> <span style="color: #F8F8F2">i])[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_vars_x)])</span>
        <span style="color: #F8F8F2">y_loadings</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append([np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">corrcoef(Y_std[:,</span> <span style="color: #F8F8F2">j],</span> <span style="color: #F8F8F2">Y_c[:,</span> <span style="color: #F8F8F2">i])[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_vars_y)])</span>

    <span style="color: #959077"># 14. 计算交叉载荷</span>
    <span style="color: #F8F8F2">x_cross_loadings</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #F8F8F2">y_cross_loadings</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components):</span>
        <span style="color: #F8F8F2">x_cross_loadings</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append([np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">corrcoef(X_std[:,</span> <span style="color: #F8F8F2">j],</span> <span style="color: #F8F8F2">Y_c[:,</span> <span style="color: #F8F8F2">i])[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_vars_x)])</span>
        <span style="color: #F8F8F2">y_cross_loadings</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append([np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">corrcoef(Y_std[:,</span> <span style="color: #F8F8F2">j],</span> <span style="color: #F8F8F2">X_c[:,</span> <span style="color: #F8F8F2">i])[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_vars_y)])</span>

    <span style="color: #959077"># 15. 冗余度分析</span>
    <span style="color: #F8F8F2">redundancy_x</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #F8F8F2">redundancy_y</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components):</span>
        <span style="color: #959077"># X 对 Y 的解释能力</span>
        <span style="color: #F8F8F2">rx</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">np</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">mean([l</span> <span style="color: #FF4689">**</span> <span style="color: #AE81FF">2</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">l</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">x_loadings[i]])</span>
        <span style="color: #F8F8F2">redundancy_x</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(round(rx</span> <span style="color: #FF4689">*</span> <span style="color: #F8F8F2">corrs[i]</span> <span style="color: #FF4689">**</span> <span style="color: #AE81FF">2</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">4</span><span style="color: #F8F8F2">))</span>
        <span style="color: #959077"># Y 对 X 的解释能力</span>

    <span style="color: #F8F8F2">ax4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_ylabel(</span><span style="color: #E6DB74">&#39;冗余度&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">ax4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_title(</span><span style="color: #E6DB74">&#39;冗余度分析&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">ax4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_xticks(x_pos)</span>
    <span style="color: #F8F8F2">ax4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_xticklabels([</span><span style="color: #E6DB74">f&#39;第{</span><span style="color: #F8F8F2">i </span><span style="color: #FF4689">+</span><span style="color: #F8F8F2"> </span><span style="color: #AE81FF">1</span><span style="color: #E6DB74">}对&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(len(redundancy_x))])</span>
    <span style="color: #F8F8F2">ax4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">legend()</span>
    <span style="color: #F8F8F2">fig4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">tight_layout()</span>
    <span style="color: #F8F8F2">buf4</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">io</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">BytesIO()</span>
    <span style="color: #F8F8F2">fig4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">savefig(buf4,</span> <span style="color: #F8F8F2">format</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;svg&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">plt</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">close(fig4)</span>
    <span style="color: #F8F8F2">svgs</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(buf4</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">getvalue()</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">decode())</span>

    <span style="color: #959077"># 图5：权重条形图（X 和 Y）</span>
    <span style="color: #F8F8F2">fig5,</span> <span style="color: #F8F8F2">axes</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">plt</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">subplots(</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">2</span><span style="color: #F8F8F2">,</span> <span style="color: #F8F8F2">figsize</span><span style="color: #FF4689">=</span><span style="color: #F8F8F2">(</span><span style="color: #AE81FF">12</span><span style="color: #F8F8F2">,</span> <span style="color: #AE81FF">4</span><span style="color: #F8F8F2">))</span>
    <span style="color: #959077"># X 权重</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">bar(range(len(X_cols)),</span> <span style="color: #F8F8F2">x_weights[:,</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">],</span> <span style="color: #F8F8F2">color</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;steelblue&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_xticks(range(len(X_cols)))</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_xticklabels(X_cols,</span> <span style="color: #F8F8F2">fontsize</span><span style="color: #FF4689">=</span><span style="color: #AE81FF">9</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_title(</span><span style="color: #E6DB74">&#39;X 组典型权重 (第一对)&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_ylabel(</span><span style="color: #E6DB74">&#39;权重&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #959077"># Y 权重</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">bar(range(len(Y_cols)),</span> <span style="color: #F8F8F2">y_weights[:,</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">],</span> <span style="color: #F8F8F2">color</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;coral&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_xticks(range(len(Y_cols)))</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_xticklabels(Y_cols,</span> <span style="color: #F8F8F2">fontsize</span><span style="color: #FF4689">=</span><span style="color: #AE81FF">9</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_title(</span><span style="color: #E6DB74">&#39;Y 组典型权重 (第一对)&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">axes[</span><span style="color: #AE81FF">1</span><span style="color: #F8F8F2">]</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">set_ylabel(</span><span style="color: #E6DB74">&#39;权重&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">fig5</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">tight_layout()</span>
    <span style="color: #F8F8F2">buf5</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">io</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">BytesIO()</span>
    <span style="color: #F8F8F2">fig5</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">savefig(buf5,</span> <span style="color: #F8F8F2">format</span><span style="color: #FF4689">=</span><span style="color: #E6DB74">&#39;svg&#39;</span><span style="color: #F8F8F2">)</span>
    <span style="color: #F8F8F2">plt</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">close(fig5)</span>
    <span style="color: #F8F8F2">svgs</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(buf5</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">getvalue()</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">decode())</span>

    <span style="color: #959077"># 17. 构建表格数据</span>
    <span style="color: #959077"># 表1：典型相关系数 + 显著性检验</span>
    <span style="color: #F8F8F2">corr_table</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components):</span>
        <span style="color: #F8F8F2">corr_table</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append([</span>
            <span style="color: #E6DB74">f&#39;第{</span><span style="color: #F8F8F2">i </span><span style="color: #FF4689">+</span><span style="color: #F8F8F2"> </span><span style="color: #AE81FF">1</span><span style="color: #E6DB74">}对&#39;</span><span style="color: #F8F8F2">,</span>
            <span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">corrs[i]</span><span style="color: #E6DB74">:.4f}&#39;</span><span style="color: #F8F8F2">,</span>
            <span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">chi2_stats[i]</span><span style="color: #E6DB74">:.4f}&#39;</span><span style="color: #F8F8F2">,</span>
            <span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">p_values[i]</span><span style="color: #E6DB74">:.4f}&#39;</span><span style="color: #F8F8F2">,</span>
            <span style="color: #E6DB74">&#39;显著&#39;</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">p_values[i]</span> <span style="color: #FF4689">&lt;</span> <span style="color: #AE81FF">0.05</span> <span style="color: #66D9EF">else</span> <span style="color: #E6DB74">&#39;不显著&#39;</span>
        <span style="color: #F8F8F2">])</span>

    <span style="color: #959077"># 表2：典型权重</span>
    <span style="color: #F8F8F2">weight_table_x</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">col_name</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(X_cols):</span>
        <span style="color: #F8F8F2">row</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[col_name]</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">x_weights[i, j]</span><span style="color: #E6DB74">:.4f}&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components)]</span>
        <span style="color: #F8F8F2">weight_table_x</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(row)</span>

    <span style="color: #F8F8F2">weight_table_y</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">col_name</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(Y_cols):</span>
        <span style="color: #F8F8F2">row</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[col_name]</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">y_weights[i, j]</span><span style="color: #E6DB74">:.4f}&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components)]</span>
        <span style="color: #F8F8F2">weight_table_y</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(row)</span>

    <span style="color: #959077"># 表3：结构载荷</span>
    <span style="color: #F8F8F2">loading_table_x</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">col_name</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(X_cols):</span>
        <span style="color: #F8F8F2">row</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[col_name]</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">x_loadings[j][i]</span><span style="color: #E6DB74">:.4f}&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components)]</span>
        <span style="color: #F8F8F2">loading_table_x</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(row)</span>

    <span style="color: #F8F8F2">loading_table_y</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i,</span> <span style="color: #F8F8F2">col_name</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">enumerate(Y_cols):</span>
        <span style="color: #F8F8F2">row</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[col_name]</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">y_loadings[j][i]</span><span style="color: #E6DB74">:.4f}&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components)]</span>
        <span style="color: #F8F8F2">loading_table_y</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(row)</span>

    <span style="color: #959077"># 表4：典型变量得分</span>
    <span style="color: #F8F8F2">score_table</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[]</span>
    <span style="color: #F8F8F2">score_header</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">&#39;样本&#39;</span><span style="color: #F8F8F2">]</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;PC{</span><span style="color: #F8F8F2">i </span><span style="color: #FF4689">+</span><span style="color: #F8F8F2"> </span><span style="color: #AE81FF">1</span><span style="color: #E6DB74">}&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components)]</span>
    <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">i</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(min(n_samples,</span> <span style="color: #AE81FF">20</span><span style="color: #F8F8F2">)):</span>  <span style="color: #959077"># 只显示前20个样本</span>
        <span style="color: #F8F8F2">row</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;样本{</span><span style="color: #F8F8F2">i </span><span style="color: #FF4689">+</span><span style="color: #F8F8F2"> </span><span style="color: #AE81FF">1</span><span style="color: #E6DB74">}&#39;</span><span style="color: #F8F8F2">]</span> <span style="color: #FF4689">+</span> <span style="color: #F8F8F2">[</span><span style="color: #E6DB74">f&#39;{</span><span style="color: #F8F8F2">X_c[i, j]</span><span style="color: #E6DB74">:.4f}&#39;</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">j</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">range(n_components)]</span>
        <span style="color: #F8F8F2">score_table</span><span style="color: #FF4689">.</span><span style="color: #F8F8F2">append(row)</span>

    <span style="color: #959077"># 18. 自动文字解读（简化版）</span>
    <span style="color: #F8F8F2">significant_pairs</span> <span style="color: #FF4689">=</span> <span style="color: #F8F8F2">sum(</span><span style="color: #AE81FF">1</span> <span style="color: #66D9EF">for</span> <span style="color: #F8F8F2">p</span> <span style="color: #FF4689">in</span> <span style="color: #F8F8F2">p_values</span> <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">p</span> <span style="color: #FF4689">&lt;</span> <span style="color: #AE81FF">0.05</span><span style="color: #F8F8F2">)</span>
    <span style="color: #66D9EF">if</span> <span style="color: #F8F8F2">significant_pairs</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">0</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">interpretation</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">&quot;未发现显著的典型相关对。建议检查数据质量或增加样本量。&quot;</span>
    <span style="color: #66D9EF">elif</span> <span style="color: #F8F8F2">significant_pairs</span> <span style="color: #FF4689">==</span> <span style="color: #AE81FF">1</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">interpretation</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">f&quot;发现1对显著的典型相关，相关系数为 {</span><span style="color: #F8F8F2">corrs[</span><span style="color: #AE81FF">0</span><span style="color: #F8F8F2">]</span><span style="color: #E6DB74">:.4f}。X组与Y组之间存在较强的线性关系。&quot;</span>
    <span style="color: #66D9EF">else</span><span style="color: #F8F8F2">:</span>
        <span style="color: #F8F8F2">interpretation</span> <span style="color: #FF4689">=</span> <span style="color: #E6DB74">f&quot;发现 {</span><span style="color: #F8F8F2">significant_pairs</span><span style="color: #E6DB74">} 对显著的典型相关，最大相关系数为 {</span><span style="color: #F8F8F2">max(corrs)</span><span style="color: #E6DB74">:.4f}。&quot;</span>

    <span style="color: #959077"># 19. 返回结果</span>

    <span style="color: #959077"># --- Tables ---</span>
