<div class="module-content" id="visualization">
  <div class="page-header">
    <div class="header-left">
      <h1>数据可视化</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 探索 / 可视化</div>
    </div>
    <div class="header-actions">
      <button class="btn-default" style="margin-right: 10px;">
        <i class="fas fa-download"></i> 导出图片
      </button>
      <button class="btn-primary btn-run" data-module="Visualization" data-func="generate_visualization">
        <i class="fas fa-play"></i> 生成图表
      </button>
    </div>
  </div>

  <div class="param-card">
    <div class="param-title"><i class="fas fa-sliders-h"></i> 可视化参数配置</div>
    <div class="param-grid">
      <div class="param-field">
        <label>图表类型</label>
        <select class="fake-select-control" data-param="chart_type">
          <option value="单变量条图" selected>单变量条图</option>
          <option value="多变量条图">多变量条图</option>
          <option value="基于单样品的条图">基于单样品的条图</option>
          <option value="统计量的箱线图">统计量的箱线图</option>
          <option value="两变量散点图">两变量散点图</option>
          <option value="多变量矩阵散点图">多变量矩阵散点图</option>
          <option value="单变量饼图">单变量饼图</option>
          <option value="多变量饼图">多变量饼图</option>
        </select>
      </div>
      <div class="param-field">
        <label>X轴变量 / 样品名 (单样品填索引，散点图填列名)</label>
        <input type="text" class="form-control" data-param="x_var" placeholder="如: 北京 或 变量1">
      </div>
      <div class="param-field">
        <label>Y轴变量 (单变量条图或散点图填列名；多变量用逗号分隔)</label>
        <input type="text" class="form-control" data-param="y_var" placeholder="如: 变量2">
      </div>
    </div>
  </div>

  <div class="metrics-row">
    <div class="metric-item">
      <div class="metric-label">数据量</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">维度</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">缺失值</div>
      <div class="metric-value">--</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <h3><i class="fas fa-chart-bar"></i> 结果图</h3>
    </div>
    <div class="chart-container" style="min-height:300px; display:flex; align-items:center; justify-content:center; color:#a0aec0; border:1px dashed #e2e8f0;">
      等待运行分析...
    </div>
    <pre class="py-output" style="margin-top:10px; padding:10px; background:#f6f9fc; border:1px solid #e2eaf2; border-radius:4px; color:#3e5468; font-size:12px; white-space:pre-wrap;"></pre>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-table"></i> 统计结果表 (均值、协方差矩阵、相关系数矩阵)</span>
    </div>
    <div id="dynamic-tables-container" style="display: flex; flex-direction: column; gap: 20px; padding: 10px;">
    </div>
  </div>
</div>

<script>
function renderTables(tables) {
    const container = document.getElementById('dynamic-tables-container');
    if (!container) return;
    container.innerHTML = '';
    if (tables && tables.length > 0) {
        tables.forEach(tableData => {
            let headerHtml = tableData.header.map(th => 
                `<th style="padding: 8px; border: 1px solid #e2e8f0; background: #f7fafc; text-align: left;">${th}</th>`
            ).join('');
            let rowsHtml = tableData.rows.map(row => {
                let tds = row.map(td => `<td style="padding: 8px; border: 1px solid #e2e8f0;">${td}</td>`).join('');
                return `<tr>${tds}</tr>`;
            }).join('');
            let tableHtml = `
                <div style="margin-bottom: 20px;">
                    <h4 style="margin-bottom: 10px; color: #2d3748;">${tableData.title}</h4>
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px; color: #4a5568;">
                        <thead><tr>${headerHtml}</tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
            container.innerHTML += tableHtml;
        });
    } else {
        container.innerHTML = '<div style="color: #a0aec0;">暂无表格数据</div>';
    }
}
</script>
