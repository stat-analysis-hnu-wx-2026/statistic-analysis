<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatCore - 多元统计分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sheet-selector {
      background: #f8fafd;
      border: 1px solid #eef1f5;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 28px;
    }
    .sheet-selector-title {
      font-size: 13px;
      font-weight: 500;
      color: #3a4a5a;
      margin-bottom: 10px;
    }
    .sheet-selector-title i {
      color: #2a5c8a;
      margin-right: 6px;
    }
    .sheet-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sheet-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #3e5060;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sheet-option:hover {
      background: #e7f0fa;
    }
    .sheet-option input[type="radio"] {
      accent-color: #2a5c8a;
    }
    .btn-confirm-sheet {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #2a5c8a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-confirm-sheet:hover {
      background: #1e4b6e;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-chart-scatter"></i></div>
        <div>
          <div class="logo-text">StatCore</div>
          <div class="logo-sub">多元统计分析·课程作业</div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-content">
          <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
          <div class="drop-text">
            <span class="drop-primary">拖拽文件到此处</span>
            <span class="drop-secondary">或</span>
            <label class="browse-btn">
              浏览文件<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
            </label>
          </div>
          <div class="drop-hint">支持 CSV、Excel 文件</div>
        </div>
      </div>

      <div id="sheetSelector" class="sheet-selector" style="display:none;">
        <div class="sheet-selector-title"><i class="fas fa-file-excel"></i> 选择要导入的工作表</div>
        <div id="sheetOptions" class="sheet-options"></div>
        <button id="confirmSheet" class="btn-confirm-sheet">确认导入</button>
      </div>

      <nav class="nav-menu">
<!--BUILD_NAV-->
      </nav>

      <div class="sidebar-footer">
        <i class="far fa-lightbulb"></i> 浏览器端 Python · Pyodide<br>
        <span style="opacity:0.7;">所有计算在本地 WebAssembly 中完成</span>
        <div class="py-status" style="margin-top:8px; font-size:12px; color:#8a9aaa;">
          <i class="fas fa-spinner fa-pulse"></i> 加载 Pyodide 中...
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
          <div class="progress-text"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="module-loading" style="text-align:center; padding:80px 20px; color:#8a9aaa;">
        <i class="fas fa-spinner fa-pulse fa-2x"></i>
        <p style="margin-top:16px;">加载模块中...</p>
      </div>
      <!--BUILD_MODULES-->
    </main>
  </div>

  <!--BUILD_PYTHON-->

  <script src="js/navigation.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/bridge.js"></script>
</body>
</html>
