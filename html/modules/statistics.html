<div class="module-content" id="statistics">
  <div class="page-header">
    <div class="header-left">
      <h1>统计评价</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 评估 / 统计评价</div>
    </div>
  </div>

  <!-- ==================== 描述性统计 ==================== -->
  <div class="eval-panel active" id="panel-descriptive">
    <div class="param-card">
      <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 描述性统计参数</div>
      <div class="param-grid">
        <div class="param-field">
          <label>选择变量</label>
          <div class="fake-select">
            <input type="text" data-param="column" placeholder="留空=所有数值变量" style="border:none;background:transparent;font-size:14px;width:100%;outline:none;">
          </div>
        </div>
      </div>
      <button class="btn-primary btn-run" data-module="Evaluation" data-func="descriptive" disabled style="margin-top:12px;">
        <i class="fas fa-play"></i> 运行分析
      </button>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-hashtag"></i> 样本量</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-calculator"></i> 均值</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-align-center"></i> 中位数</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-arrows-up-down"></i> 标准差</div>
        <div class="metric-value">--</div>
      </div>
    </div>

    <div class="table-preview">
      <div class="preview-header">
        <span><i class="fas fa-table"></i> 描述性统计结果</span>
        <span class="badge">数值变量分析</span>
      </div>
      <table class="simple-table">
        <thead><tr><th>统计指标</th><th>---</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <pre class="py-output" style="margin-top:16px;">点击运行开始分析...</pre>
  </div>

  <!-- ==================== 正态性检验 ==================== -->
  <div class="eval-panel" id="panel-normality">
    <div class="param-card">
      <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 正态性检验参数</div>
      <div class="param-grid">
        <div class="param-field">
          <label>选择变量</label>
          <div class="fake-select">
            <input type="text" data-param="column" placeholder="留空=所有数值变量" style="border:none;background:transparent;font-size:14px;width:100%;outline:none;">
          </div>
        </div>
        <div class="param-field">
          <label>显著性水平 (α)</label>
          <select data-param="alpha" style="background:#f9fbfd;border:1px solid #d6e0ea;border-radius:40px;padding:10px 20px;font-size:14px;">
            <option value="0.05" selected>0.05</option>
            <option value="0.01">0.01</option>
            <option value="0.10">0.10</option>
          </select>
        </div>
      </div>
      <button class="btn-primary btn-run" data-module="Evaluation" data-func="normality" disabled style="margin-top:12px;">
        <i class="fas fa-play"></i> 运行检验
      </button>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-chart-line"></i> W统计量</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-percent"></i> p值</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-check-circle"></i> 正态性</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-info-circle"></i> 显著性水平</div>
        <div class="metric-value">--</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <h3><i class="fas fa-chart-line" style="margin-right:8px; color:#1e4b6e;"></i>Q-Q 图</h3>
      </div>
      <div class="chart-container"></div>
    </div>

    <div class="table-preview" style="margin-top:8px;">
      <div class="preview-header">
        <span><i class="fas fa-table"></i> 检验结果</span>
        <span class="badge">Shapiro-Wilk</span>
      </div>
      <table class="simple-table">
        <thead><tr><th>检验项目</th><th>统计量</th><th>p值</th><th>结论</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <pre class="py-output" style="margin-top:16px;">点击运行开始分析...</pre>
  </div>

  <!-- ==================== 方差分析 ==================== -->
  <div class="eval-panel" id="panel-anova">
    <div class="param-card">
      <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 方差分析参数</div>
      <div class="param-grid">
        <div class="param-field">
          <label>因变量 (数值列名)</label>
          <div class="fake-select">
            <input type="text" data-param="dependent_var" placeholder="如 salary" style="border:none;background:transparent;font-size:14px;width:100%;outline:none;">
          </div>
        </div>
        <div class="param-field">
          <label>分组变量 (分类列名)</label>
          <div class="fake-select">
            <input type="text" data-param="group_var" placeholder="如 education" style="border:none;background:transparent;font-size:14px;width:100%;outline:none;">
          </div>
        </div>
      </div>
      <button class="btn-primary btn-run" data-module="Evaluation" data-func="anova" disabled style="margin-top:12px;">
        <i class="fas fa-play"></i> 运行分析
      </button>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-chart-line"></i> F值</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-percent"></i> p值</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-check-circle"></i> 显著性</div>
        <div class="metric-value">--</div>
      </div>
      <div class="metric-item">
        <div class="metric-label"><i class="fas fa-layer-group"></i> 组数</div>
        <div class="metric-value">--</div>
      </div>
    </div>

    <div class="table-preview">
      <div class="preview-header">
        <span><i class="fas fa-table"></i> 各组统计</span>
        <span class="badge">组间对比</span>
      </div>
      <table class="simple-table">
        <thead><tr><th>组别</th><th>样本量</th><th>均值</th><th>标准差</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <h3><i class="fas fa-chart-bar" style="margin-right:8px; color:#1e4b6e;"></i>箱线图</h3>
      </div>
      <div class="chart-container"></div>
    </div>

    <div class="table-preview">
      <div class="preview-header">
        <span><i class="fas fa-calculator"></i> 方差分析表</span>
        <span class="badge">ANOVA</span>
      </div>
      <table class="anova-table simple-table">
        <thead><tr><th>来源</th><th>SS</th><th>df</th><th>MS</th><th>F值</th><th>p值</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <pre class="py-output" style="margin-top:16px;">点击运行开始分析...</pre>
  </div>
</div>
