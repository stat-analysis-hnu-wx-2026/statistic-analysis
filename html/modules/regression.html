<div class="module-content" id="regression">
  <div class="page-header">
    <div class="header-left">
      <h1>相关与回归</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 关系 / 回归</div>
    </div>
    <div class="header-actions">
      <button class="btn-primary btn-run" data-module="CorrelationRegression" data-func="analyze">
        <i class="fas fa-play"></i> 运行分析
      </button>
    </div>
  </div>

  <div class="param-card">
    <div class="param-title"><i class="fas fa-sliders-h" style="color:#2a5c8a;"></i> 分析参数配置</div>
    <div class="param-grid">
      <div class="param-field">
        <label>分析类型</label>
        <select class="fake-select-control" data-param="analysis_type">
          <option value="all" selected>完整分析</option>
          <option value="correlation">相关分析</option>
          <option value="simple">一元回归</option>
          <option value="multiple">多元回归</option>
        </select>
      </div>
      <div class="param-field">
        <label>因变量 Y</label>
        <input class="fake-select-control" data-param="y_col" type="text" placeholder="如: y 或 Y">
      </div>
      <div class="param-field" style="flex:1; min-width:260px;">
        <label>自变量 X</label>
        <input class="fake-select-control" data-param="x_cols" type="text" placeholder="如: x1, x2, x3" style="width:100%;">
      </div>
      <div class="param-field">
        <label>显著性水平</label>
        <input class="fake-select-control" data-param="alpha" type="number" min="0.001" max="0.2" step="0.001" value="0.05">
      </div>
    </div>
  </div>

  <div class="metrics-row">
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-table-list"></i> 有效样本数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-diagram-project"></i> 自变量数</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-link"></i> 复相关 R</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-square-poll-vertical"></i> 决定系数 R²</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-chart-line"></i> 调整 R²</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label"><i class="fas fa-ruler-combined"></i> RMSE</div>
      <div class="metric-value">--</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <h3><i class="fas fa-chart-line" style="margin-right:8px; color:#1e4b6e;"></i>图形结果</h3>
    </div>
    <div class="chart-container" style="min-height:300px;display:flex;align-items:center;justify-content:center;color:#7a8c9d;">
      点击“运行分析”后在这里显示图形
    </div>
    <pre class="py-output" style="margin:12px 8px 0;padding:10px 12px;background:#f6f9fc;border:1px solid #e2eaf2;border-radius:8px;color:#3e5468;font-size:12px;white-space:pre-wrap;">等待运行...</pre>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-table-cells"></i> 相关系数与显著性</span>
      <span class="badge">Pearson</span>
    </div>
    <div style="overflow-x:auto;">
      <table class="simple-table">
        <thead><tr><th>变量</th><th>结果</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-clipboard-check"></i> 回归系数检验</span>
      <span class="badge">OLS</span>
    </div>
    <div style="overflow-x:auto;">
      <table class="simple-table">
        <thead><tr><th>项</th><th>估计值</th><th>标准误</th><th>t</th><th>p</th><th>CI 下限</th><th>CI 上限</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-gauge-high"></i> 模型拟合指标</span>
      <span class="badge">检验</span>
    </div>
    <table class="simple-table">
      <thead><tr><th>指标</th><th>值</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-layer-group"></i> 嵌套模型比较</span>
      <span class="badge">按 X 顺序</span>
    </div>
    <div style="overflow-x:auto;">
      <table class="simple-table">
        <thead><tr><th>模型</th><th>自变量</th><th>R²</th><th>调整 R²</th><th>F</th><th>p</th><th>AIC</th><th>BIC</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-list-ol"></i> 拟合值与残差</span>
      <span class="badge">前 12 行</span>
    </div>
    <div style="overflow-x:auto;">
      <table class="simple-table">
        <thead><tr><th>序号</th><th>实际值</th><th>拟合值</th><th>残差</th><th>标准化残差</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
