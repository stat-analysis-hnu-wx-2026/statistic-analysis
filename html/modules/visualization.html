<div class="module-content" id="visualization">
  <div class="page-header">
    <div class="header-left">
      <h1>数据可视化</h1>
      <div class="breadcrumb"><i class="fas fa-folder-open"></i> 探索 / 可视化</div>
    </div>
    <div class="header-actions">
      <button class="btn-default" style="margin-right: 10px;">
        <i class="fas fa-download"></i> 导出图片
      </button>
      <button class="btn-primary btn-run" data-module="Visualization" data-func="generate_visualization">
        <i class="fas fa-play"></i> 生成图表
      </button>
    </div>
  </div>

  <div class="param-card">
    <div class="param-title"><i class="fas fa-sliders-h"></i> 可视化参数配置</div>
    <div class="param-grid">
      <div class="param-field">
        <label>图表类型</label>
        <select class="fake-select-control" data-param="chart_type">
          <option value="散点图" selected>散点图</option>
          <option value="折线图">折线图</option>
          <option value="热力图">热力图</option>
          <option value="箱线图">箱线图</option>
        </select>
      </div>
      <div class="param-field">
        <label>X轴变量 (填写表头列名)</label>
        <input type="text" class="fake-select-control" data-param="x_var" placeholder="如: 变量1">
      </div>
      <div class="param-field">
        <label>Y轴变量 (填写表头列名)</label>
        <input type="text" class="fake-select-control" data-param="y_var" placeholder="如: 变量2">
      </div>
    </div>
  </div>

  <div class="metrics-row">
    <div class="metric-item">
      <div class="metric-label">数据量</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">维度</div>
      <div class="metric-value">--</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">缺失值</div>
      <div class="metric-value">--</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <h3><i class="fas fa-chart-bar"></i> 结果图</h3>
    </div>
    <div class="chart-container" style="min-height:300px; display:flex; align-items:center; justify-content:center; color:#a0aec0; border:1px dashed #e2e8f0;">
      等待运行分析...
    </div>
    <pre class="py-output" style="margin-top:10px; padding:10px; background:#f6f9fc; border:1px solid #e2eaf2; border-radius:4px; color:#3e5468; font-size:12px; white-space:pre-wrap;"></pre>
  </div>

  <div class="table-preview">
    <div class="preview-header">
      <span><i class="fas fa-table"></i> 描述性统计表</span>
    </div>
    <table class="simple-table">
      <thead>
        <tr><th>特征</th><th>均值</th><th>标准差</th></tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</div>
