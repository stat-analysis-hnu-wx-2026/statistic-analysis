<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据可视化</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; color: #1a202c; }
        .header p { margin: 5px 0 0 0; color: #718096; font-size: 14px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #2b6cb0; color: white; }
        .btn-default { background: white; border: 1px solid #cbd5e0; margin-right: 10px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-size: 13px; color: #718096; margin-bottom: 5px; }
        select { padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; width: 160px; }
        .chart-area { min-height: 400px; border: 1px dashed #e2e8f0; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
        .metrics-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .metric-card { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .metric-title { color: #718096; font-size: 13px; }
        .metric-value { font-size: 20px; font-weight: bold; margin-top: 8px; color: #2d3748; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        th { color: #718096; font-weight: normal; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>数据可视化</h1>
            <p>📁 探索 / 可视化</p>
        </div>
        <div>
            <button class="btn btn-default">📥 导出图片</button>
            <button class="btn btn-primary" onclick="fetchAndRender()">▶ 生成图表</button>
        </div>
    </div>

    <div class="card">
        <h3>可视参数配置</h3>
        <div class="controls">
            <div class="control-group">
                <label>图表类型</label>
                <select id="chartType">
                    <option value="散点图">散点图</option>
                    <option value="折线图">折线图</option>
                    <option value="热力图">热力图</option>
                    <option value="箱线图">箱线图</option>
                </select>
            </div>
            <div class="control-group">
                <label>X轴变量</label>
                <select id="xVar"><option value="变量1">变量1</option></select>
            </div>
            <div class="control-group">
                <label>Y轴变量</label>
                <select id="yVar"><option value="变量2">变量2</option></select>
            </div>
        </div>
        <div class="chart-area" id="chartBox">
            <span style="color:#a0aec0;">点击生成图表进行渲染</span>
        </div>
    </div>

    <div class="metrics-container">
        <div class="metric-card">
            <div class="metric-title">数据量</div>
            <div class="metric-value" id="val-volume">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">维度</div>
            <div class="metric-value" id="val-dim">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">缺失值</div>
            <div class="metric-value" id="val-missing">--</div>
        </div>
    </div>

    <div class="card">
        <h3>描述性统计表</h3>
        <table>
            <thead>
                <tr><th>特征</th><th>均值</th><th>标准差</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="3" style="text-align:center;color:#a0aec0;padding:20px;">暂无数据</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchAndRender() {
            const mockResponse = {
                "metrics": { "数据量": "1000", "维度": "5", "缺失值": "0" },
                "tables": [{
                    "header": ["特征", "均值", "标准差"],
                    "rows": [
                        ["变量1", "12.5000", "1.2345"],
                        ["变量2", "8.1200", "0.9876"]
                    ]
                }],
                "svg": "<svg width='100%' height='400'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='#4a5568'>图表已成功渲染</text></svg>"
            };
            
            document.getElementById('val-volume').innerText = mockResponse.metrics['数据量'];
            document.getElementById('val-dim').innerText = mockResponse.metrics['维度'];
            document.getElementById('val-missing').innerText = mockResponse.metrics['缺失值'];
            
            document.getElementById('chartBox').innerHTML = mockResponse.svg;
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            mockResponse.tables[0].rows.forEach(rowData => {
                const tr = document.createElement('tr');
                rowData.forEach(cellData => {
                    const td = document.createElement('td');
                    td.innerText = cellData;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
